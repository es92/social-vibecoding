name: Build Kubernetes images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/k8s]
  schedule:
    # Pick up a new Claude Code release even on a day with no source change.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Refresh images with newly pulled bases and no cached build layers'
        type: choice
        default: none
        options: [none, worker, capture, all]

permissions:
  contents: read
  packages: write

concurrency:
  group: kubernetes-images-${{ github.ref }}
  cancel-in-progress: false
  # The default single pending slot cancels an earlier merge's release.
  queue: max

jobs:
  security-lockfiles:
    name: Audit all three lockfiles
    # A gate on publishing, not on building (28 Oct 2026: the image builds
    # waited ~1.7 min for these): the images build beside them and the release
    # job waits for every one to pass. A run that will not release (a merge
    # behind main's tip) skips them; a pull request still runs them.
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.plan.outputs.should_release == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - run: node scripts/security-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security
          path: security-reports/
          if-no-files-found: error
          retention-days: 30

  security-regressions:
    name: Security regressions (${{ matrix.os }})
    # The same gate as the lockfile audit above.
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.plan.outputs.should_release == 'true') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - run: npm ci
      # Deliberately no --test-force-exit: open handles must fail the check.
      - run: node --require ./tests/lib/test-net.js --test --test-timeout=180000 tests/build-stop-hook.test.js tests/inloop-launch.test.js tests/security-update.test.js tests/web-fetch.test.js tests/web-fetch-dns-pinning.test.js
        timeout-minutes: 6

      - run: node --require ./tests/lib/test-net.js --test --test-timeout=60000 tests/private-streams.test.js
        timeout-minutes: 2

  preview-schema-compatibility:
    name: Preview schema compatibility (PostgreSQL 17/18)
    # The same gate as the lockfile audit above.
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.plan.outputs.should_release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres17:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432/tcp]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432/tcp]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Authority fixtures load real workflow handlers that depend on bcrypt.
      - run: |
          npm rebuild bcrypt --build-from-source
          node --test --test-timeout=60000 tests/platform-preview-schema-compatibility.test.js tests/workflow-event-authority-postgres.test.js tests/turn-publication-postgres.test.js tests/worker-release-workflow-postgres.test.js
          node --test --test-timeout=60000 tests/worker-eviction-postgres.test.js
          node --test --test-timeout=60000 tests/worker-stop-workflow-postgres.test.js tests/platform-preview-startup-postgres.test.js
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres17.ports[5432] }}/postgres
          TEST_PREVIEW_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres18.ports[5432] }}/postgres

      # A preceding database regression may already have built authentication.
      - run: |
          node -e "require('bcrypt')" || npm rebuild bcrypt --build-from-source
          node --require ./tests/lib/test-net.js --test --test-timeout=60000 --test-concurrency=1 tests/private-streams-postgres.test.js tests/notification-current-access-postgres.test.js tests/global-chat-turn-routes.test.js
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres17.ports[5432] }}/postgres

  security-images:
    name: Build and scan ${{ matrix.component }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: platform, dockerfile: Dockerfile.kubernetes, context: '.' }
          - { component: standalone, dockerfile: Dockerfile, context: '.' }
          - { component: worker, dockerfile: worker/Dockerfile, context: worker }
          - { component: capture, dockerfile: capture/Dockerfile, context: '.' }
          - { component: starter, dockerfile: '', context: '' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and scan the finished image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          if [ "$COMPONENT" = starter ]; then
            node scripts/security-starter.js "$RUNNER_TEMP/starter-source"
            CONTEXT="$RUNNER_TEMP/starter-source"
            DOCKERFILE="$CONTEXT/Dockerfile"
          fi
          docker buildx build --load --pull --platform linux/amd64 -t "security-$COMPONENT" -f "$DOCKERFILE" "$CONTEXT"
          out="$RUNNER_TEMP/security-$COMPONENT"
          mkdir -p "$out"
          sh scripts/create-image-sbom.sh "security-$COMPONENT" "$out/sbom.spdx.json"
          sh scripts/check-image-security.sh "security-$COMPONENT" "$out" "$out/sbom.spdx.json" "$COMPONENT"
      - name: Verify capture browser and media
        if: matrix.component == 'capture'
        timeout-minutes: 2
        run: |
          docker run --rm -i --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint node security-capture < scripts/verify-capture-image.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-image-security-${{ matrix.component }}
          path: ${{ runner.temp }}/security-${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 30

  scheduled-image-audit:
    name: Audit reused ${{ matrix.component }} image
    if: github.event_name == 'schedule'
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [platform, worker, capture]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Resolve the existing image
        id: reuse
        env:
          COMPONENT: ${{ matrix.component }}
          FORCE_REBUILD: none
          REUSE_CURRENT_PLATFORM: ${{ matrix.component == 'platform' }}
          CLAUDE_CODE_VERSION: ${{ needs.plan.outputs.claude_code_version }}
        run: node scripts/resolve-kubernetes-image.js
      # A missing worker is built and checked by the ordinary build job in
      # this same run. Existing images are scanned even when no release runs.
      - name: Scan existing immutable image
        if: steps.reuse.outputs.digest != ''
        env:
          IMAGE: ${{ steps.reuse.outputs.image }}@${{ steps.reuse.outputs.digest }}
          REPORT: ${{ runner.temp }}/scheduled-security-${{ matrix.component }}
        run: sh scripts/check-published-image.sh "$IMAGE" "$REPORT" "${{ matrix.component }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.reuse.outputs.digest != ''
        with:
          name: scheduled-image-security-${{ matrix.component }}
          path: ${{ runner.temp }}/scheduled-security-${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 30

  plan:
    if: github.event_name != 'pull_request'
    name: Plan image release
    runs-on: ubuntu-latest
    outputs:
      claude_code_version: ${{ steps.claude.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - run: |
          npm install --global npm@11.21.1 undici@6.29.1
          image_npm_root="$(npm root --global)"
          rm -rf "$image_npm_root/npm/node_modules/undici"
          mv "$image_npm_root/undici" "$image_npm_root/npm/node_modules/undici"

      - name: Resolve Claude Code version
        id: claude
        shell: bash
        run: |
          version="$(npm view @anthropic-ai/claude-code@latest version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Claude Code version from npm: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name == 'schedule'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The BuildKit daemon from Google's Docker Hub mirror, as the build
      # job's: see the note there.
      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'schedule'
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Check scheduled worker image
        id: scheduled_worker
        if: github.event_name == 'schedule'
        env:
          COMPONENT: worker
          FORCE_REBUILD: none
          CLAUDE_CODE_VERSION: ${{ steps.claude.outputs.version }}
        run: node scripts/resolve-kubernetes-image.js

      # A dependency-only refresh must not rebuild or silently change either
      # non-worker image. Reuse the platform artifact published for this exact
      # main revision and the capture artifact for its tracked build inputs.
      - name: Resolve current platform image
        id: current_platform
        if: github.event_name == 'schedule' && steps.scheduled_worker.outputs.digest == ''
        env:
          COMPONENT: platform
          FORCE_REBUILD: none
          REUSE_CURRENT_PLATFORM: 'true'
        run: node scripts/resolve-kubernetes-image.js

      - name: Resolve current capture image
        id: current_capture
        if: github.event_name == 'schedule' && steps.scheduled_worker.outputs.digest == ''
        env:
          COMPONENT: capture
          FORCE_REBUILD: none
        run: node scripts/resolve-kubernetes-image.js

      - name: Record scheduled base digests
        if: github.event_name == 'schedule' && steps.scheduled_worker.outputs.digest == ''
        env:
          PLATFORM_DIGEST: ${{ steps.current_platform.outputs.digest }}
          CAPTURE_DIGEST: ${{ steps.current_capture.outputs.digest }}
        shell: bash
        run: |
          if [ -z "$CAPTURE_DIGEST" ]; then
            echo "The current capture artifact is missing; run the normal main workflow first." >&2
            exit 1
          fi
          for digest in "$PLATFORM_DIGEST" "$CAPTURE_DIGEST"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Invalid scheduled base image digest: $digest" >&2
              exit 1
            }
          done
          mkdir -p "$RUNNER_TEMP/image-digest"
          printf '%s\n' "$PLATFORM_DIGEST" > "$RUNNER_TEMP/image-digest/platform.txt"
          printf '%s\n' "$CAPTURE_DIGEST" > "$RUNNER_TEMP/image-digest/capture.txt"

      - name: Upload scheduled base digests
        if: github.event_name == 'schedule' && steps.scheduled_worker.outputs.digest == ''
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-scheduled-bases
          path: ${{ runner.temp }}/image-digest/*.txt
          if-no-files-found: error
          retention-days: 7

      - uses: azure/setup-helm@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          version: v3.19.0

      # Runs on main are queued one at a time, and a run whose commit is no
      # longer main's tip builds all three images and then, in "Check branch
      # tip before publishing", almost always skips: in a burst of merges the
      # run that will release waits behind builds nobody uses. So a run that
      # is already behind the tip when it starts, and that the publish step
      # could not let release ahead of the tip, builds nothing. That is when
      # the newest release already contains it, or when that release's
      # revision was merged less than RELEASE_EVERY_MINUTES before it. Runs
      # are queued one at a time, so the newest release cannot change between
      # here and the publish step, and main's tip only moves on. Anything that
      # cannot be read builds, as before; the tip always builds.
      - name: Check whether this run can release
        id: behind
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVERY_MINUTES: '15'
        run: |
          set -uo pipefail
          build() { echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          skip() {
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          tip="$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)"
          [[ "$tip" =~ ^[a-f0-9]{40}$ ]] || build
          [ "$tip" != "$GITHUB_SHA" ] || build
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          chart="$(helm show chart "oci://ghcr.io/$owner/charts/social-vibecoding-platform" --version '0.1.*' 2>/dev/null || true)"
          published_sha="$(printf '%s\n' "$chart" | sed -n 's/^appVersion: *//p' | tr -d '"' | head -n 1)"
          [[ "$published_sha" =~ ^[a-f0-9]{40}$ ]] || build
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$published_sha...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)"
          case "$status" in
            behind|identical) skip "No build: main is at $tip, and the newest release ($published_sha) already contains $GITHUB_SHA." ;;
            ahead) ;;
            *) build ;;
          esac
          merged_at() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq '.commit.committer.date | fromdateiso8601' 2>/dev/null || echo; }
          this_at="$(merged_at "$GITHUB_SHA")"
          published_at="$(merged_at "$published_sha")"
          [[ "$this_at" =~ ^[0-9]+$ && "$published_at" =~ ^[0-9]+$ ]] || build
          [ $(( this_at - published_at )) -lt $(( RELEASE_EVERY_MINUTES * 60 )) ] || build
          skip "No build: main is at $tip, whose run releases $GITHUB_SHA, and the newest release ($published_sha) is under $RELEASE_EVERY_MINUTES minutes older, so this run could not release ahead of the tip."

      - name: Select release work
        id: release
        env:
          SCHEDULED_WORKER_DIGEST: ${{ steps.scheduled_worker.outputs.digest }}
          CLAUDE_CODE_VERSION: ${{ steps.claude.outputs.version }}
          BEHIND_SKIP: ${{ steps.behind.outputs.skip }}
          BEHIND_REASON: ${{ steps.behind.outputs.reason }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo 'matrix={"include":[{"component":"worker","context":"worker","dockerfile":"worker/Dockerfile"}]}' >> "$GITHUB_OUTPUT"
            if [ -n "$SCHEDULED_WORKER_DIGEST" ]; then
              echo 'should_release=false' >> "$GITHUB_OUTPUT"
              reason="No release: worker image already contains Claude Code $CLAUDE_CODE_VERSION."
            else
              echo 'should_release=true' >> "$GITHUB_OUTPUT"
              reason="Release required: Claude Code $CLAUDE_CODE_VERSION has no matching worker image."
            fi
          else
            echo 'matrix={"include":[{"component":"platform","context":".","dockerfile":"Dockerfile.kubernetes"},{"component":"worker","context":"worker","dockerfile":"worker/Dockerfile"},{"component":"capture","context":".","dockerfile":"capture/Dockerfile"}]}' >> "$GITHUB_OUTPUT"
            if [ "${BEHIND_SKIP:-}" = true ]; then
              echo 'should_release=false' >> "$GITHUB_OUTPUT"
              reason="$BEHIND_REASON"
            else
              echo 'should_release=true' >> "$GITHUB_OUTPUT"
              reason="Normal source release."
            fi
          fi
          printf '### Kubernetes image plan\n\n- Claude Code: `%s`\n- %s\n' \
            "$CLAUDE_CODE_VERSION" "$reason" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Resolve ${{ matrix.component }} image
    # The gates run beside the builds; the release job waits for them.
    needs: [plan]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      # No npm here: these steps run node scripts and Docker, never npm.

      - name: Normalize GHCR owner
        id: registry
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          test -n "$owner"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing in the build comes from Docker Hub directly. Pulls from Docker
      # Hub here are anonymous, and Docker Hub limits those per IP address,
      # which GitHub's runners share with everybody else's builds: on 9 Oct
      # 2026 four releases in a row (20:52 to 21:15) failed in under a minute
      # on "429 Too Many Requests" for node:22-alpine, and the re-runs failed
      # on Docker Hub's token service answering 504. mirror.gcr.io, Google's
      # Docker Hub mirror, serves the same images without that limit.
      #
      #   driver-opts image   the BuildKit daemon itself (moby/buildkit),
      #                       which the runner's Docker pulls before any
      #                       build starts, so the config below cannot reach
      #                       it: the capture job failed right here at 21:41.
      #   buildkitd config    every docker.io image a build pulls: the base
      #                       images (node:22-alpine, node:22-bookworm-slim)
      #                       and the SBOM scanner `sbom: true` runs
      #                       (docker/buildkit-syft-scanner). BuildKit tries
      #                       the mirror first and falls back to Docker Hub.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Resolve Claude Code version
        id: claude
        if: matrix.component == 'worker'
        env:
          CLAUDE_CODE_VERSION: ${{ needs.plan.outputs.claude_code_version }}
        shell: bash
        run: |
          echo "version=$CLAUDE_CODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_arg=CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve reusable ${{ matrix.component }} image
        id: reuse
        env:
          COMPONENT: ${{ matrix.component }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'none' }}
          CLAUDE_CODE_VERSION: ${{ steps.claude.outputs.version }}
        run: node scripts/resolve-kubernetes-image.js

      - name: Build and push ${{ matrix.component }}
        id: build
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/social-vibecoding-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ steps.reuse.outputs.reuse_tag }}
          pull: true
          no-cache: ${{ steps.reuse.outputs.refresh == 'true' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ steps.claude.outputs.build_arg }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=social-vibecoding-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=social-vibecoding-${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Verify runtime and scan the exact image SBOM
        env:
          IMAGE: ${{ steps.reuse.outputs.image }}@${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
          REPORT: ${{ runner.temp }}/security-${{ matrix.component }}
        run: sh scripts/check-published-image.sh "$IMAGE" "$REPORT" "${{ matrix.component }}"

      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ matrix.component }}
          path: ${{ runner.temp }}/security-${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 30

      - name: Record immutable reference
        env:
          IMAGE_DIGEST: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.reuse.outputs.image }}
          RESOLUTION: ${{ steps.reuse.outputs.reason }}
          COMPONENT: ${{ matrix.component }}
          CLAUDE_CODE_VERSION: ${{ steps.claude.outputs.version }}
        run: |
          case "$IMAGE_DIGEST" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) echo "Invalid image digest: $IMAGE_DIGEST" >&2; exit 1 ;;
          esac
          test "${#IMAGE_DIGEST}" -eq 71
          mkdir -p "$RUNNER_TEMP/image-digest"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/image-digest/$COMPONENT.txt"
          printf '### %s (%s)\n' "$COMPONENT" "$RESOLUTION" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          printf '%s@%s\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMPONENT" = worker ]; then
            printf 'Claude Code: `%s`\n' "$CLAUDE_CODE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ${{ matrix.component }} digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.component }}
          path: ${{ runner.temp }}/image-digest/${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish atomic Helm release
    needs: [build, scheduled-image-audit, security-lockfiles, security-regressions, preview-schema-compatibility]
    # Schedule-only audits skip on pushes/dispatches. Override the default
    # success() dependency check while still refusing a failed/skipped build,
    # failed scheduled scans, a gate that did not pass, or cancellation.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
          && needs['security-lockfiles'].result == 'success'
          && needs['security-regressions'].result == 'success'
          && needs['preview-schema-compatibility'].result == 'success'
          && (github.event_name != 'schedule' || needs['scheduled-image-audit'].result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      # Reads this workflow's own runs: when the newest release went out, and
      # whether a dispatched run is queued (see "Check branch tip before
      # publishing").
      actions: read
      contents: read
      packages: write
    env:
      # An Argo CD project-role token that may `get` (and so refresh) the
      # platform Application — provisioned by the infra repository, see
      # "Ask Argo CD to pick up the release now" below. Unset, it is the empty
      # string and that step skips. It lives here rather than on the step
      # because a step-level `if:` cannot read `secrets`; it can read `env`.
      ARGOCD_REFRESH_TOKEN: ${{ secrets.ARGOCD_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      # No npm here: these steps run node, Helm and Docker, never npm.

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Check the actual packaged image, including the platform image reused
      # by scheduled worker refreshes, before a chart can reach Argo CD.
      - name: Validate platform shell release
        timeout-minutes: 5
        shell: bash
        run: |
          digest="$(cat "$RUNNER_TEMP/image-digests/platform.txt")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/social-vibecoding-platform@$digest"
          docker run --rm -i --network none --read-only \
            --env NODE_ENV=production --env GIT_SHA="$GITHUB_SHA" \
            --entrypoint node "$image" - <<'NODE'
          const { loadShellRelease } = require('./src/services/shell-release');
          const release = loadShellRelease('/app/public');
          console.log(`Verified platform shell release ${release.revision}: ${release.id}`);
          NODE

      - name: Prepare and validate release chart
        id: chart
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          release_patch=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            chart_version="0.1.${release_patch}"
            release_channel=stable
          else
            chart_version="0.0.${release_patch}-feat-k8s"
            release_channel=candidate
          fi

          registry_owner=$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          chart_dir="$RUNNER_TEMP/social-vibecoding-platform-chart"
          package_dir="$RUNNER_TEMP/helm-package"
          mkdir -p "$package_dir"
          cp -R deploy/helm/social-vibecoding-platform "$chart_dir"

          CHART_DIR="$chart_dir" REGISTRY_OWNER="$registry_owner" node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const digestDir = path.join(process.env.RUNNER_TEMP, 'image-digests');
          const digest = (component) => {
            const value = fs.readFileSync(path.join(digestDir, `${component}.txt`), 'utf8').trim();
            if (!/^sha256:[a-f0-9]{64}$/.test(value)) {
              throw new Error(`Invalid ${component} digest: ${value}`);
            }
            return value;
          };

          const owner = process.env.REGISTRY_OWNER;
          const sourceRevision = process.env.GITHUB_SHA;
          if (!/^[a-f0-9]{40}$/.test(sourceRevision)) {
            throw new Error(`Invalid source revision: ${sourceRevision}`);
          }

          const values = [
            '# Generated by .github/workflows/build-kubernetes-images.yml.',
            '# This file is packaged inside the immutable OCI Helm release.',
            'release:',
            `  sourceRevision: "${sourceRevision}"`,
            'platform:',
            '  image:',
            `    repository: ghcr.io/${owner}/social-vibecoding-platform`,
            `    digest: ${digest('platform')}`,
            '  workerImage:',
            `    repository: ghcr.io/${owner}/social-vibecoding-worker`,
            `    digest: ${digest('worker')}`,
            '  captureImage:',
            `    repository: ghcr.io/${owner}/social-vibecoding-capture`,
            `    digest: ${digest('capture')}`,
            '',
          ].join('\n');

          fs.writeFileSync(path.join(process.env.CHART_DIR, 'values.release.yaml'), values, { mode: 0o644 });
          NODE

          helm lint "$chart_dir" \
            -f "$chart_dir/values.release.yaml" \
            --set enabled=true \
            --set secrets.create=false \
            --set secrets.existingSecret=social-vibecoding
          helm template social-vibecoding-platform "$chart_dir" \
            -f "$chart_dir/values.release.yaml" \
            --set enabled=true \
            --set secrets.create=false \
            --set secrets.existingSecret=social-vibecoding >/dev/null

          inactive_manifest="$RUNNER_TEMP/social-vibecoding-platform-inactive.yaml"
          helm template social-vibecoding-platform "$chart_dir" \
            -f "$chart_dir/values.release.yaml" \
            --set enabled=true \
            --set platform.enabled=false \
            --set migration.enabled=false \
            --set postgresql.enabled=false \
            --set postgresql.host=social-postgres-rw.social-platform.svc.cluster.local \
            --set secrets.create=false \
            --set secrets.existingSecret=social-vibecoding \
            --set ingress.enabled=false >"$inactive_manifest"
          ! grep -q '^kind:' "$inactive_manifest"

          external_manifest="$RUNNER_TEMP/social-vibecoding-platform-external.yaml"
          helm template social-vibecoding-platform "$chart_dir" \
            -f "$chart_dir/values.release.yaml" \
            --set enabled=true \
            --set postgresql.enabled=false \
            --set postgresql.host=social-postgres-rw.social-platform.svc.cluster.local \
            --set-json 'postgresql.podSelector={"cnpg.io/cluster":"social-postgres"}' \
            --set secrets.create=false \
            --set secrets.existingSecret=social-vibecoding >"$external_manifest"
          ! grep -q '^kind: StatefulSet$' "$external_manifest"
          grep -q 'cnpg.io/cluster: social-postgres' "$external_manifest"

          helm package "$chart_dir" \
            --destination "$package_dir" \
            --version "$chart_version" \
            --app-version "$GITHUB_SHA"

          package_path="$package_dir/social-vibecoding-platform-${chart_version}.tgz"
          test -f "$package_path"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "release_channel=$release_channel" >> "$GITHUB_OUTPUT"
          echo "registry_owner=$registry_owner" >> "$GITHUB_OUTPUT"

      # Push events can be queued out of order, and Argo CD runs the highest
      # 0.1.* chart: an older source revision must never publish a higher
      # chart version than a newer one. The branch tip always publishes.
      #
      # Requiring the exact tip guaranteed that, but runs are queued one at a
      # time (concurrency above), so while merges land faster than a run
      # finishes every run found a newer tip and nothing was released. On 5
      # October nothing deployed from 16:12 to about 17:50 UTC while twelve
      # merges built. So a stable run that is no longer the tip still
      # publishes when the branch contains its revision, the newest release in
      # the registry is older than it and numbered below it, and that release's
      # revision was merged at least RELEASE_EVERY_MINUTES before this one: a
      # burst of merges ships a release about that often instead of none, and
      # not one per merge, since every release restarts the platform. Anything
      # that cannot be read falls back to the exact tip.
      #
      # The tip itself still published every time. On 7 October approved
      # proposals merged one after another, each run took two to four
      # minutes, and most runs were the tip when they finished: the platform
      # rolled out at 21:41:57, 21:50:46, 21:53:44 and 21:57:49 UTC, four
      # times in sixteen minutes, and more than sixty times that day. Each
      # rollout restarts the platform, which re-runs every proposal's checks
      # in flight (slowing the queue further) and interrupts the bot's builds.
      # So a stable release now goes out no sooner than
      # RELEASE_MIN_GAP_MINUTES after the one before it, timed from the end of
      # the run that published it (when Argo CD was asked to roll it out):
      #   - The tip waits in this step until the gap has passed (so at most
      #     that long), then re-reads the branch: still the tip, it publishes.
      #     A newer merge landing meanwhile ends the wait and this run skips;
      #     that merge's run is queued behind this one and publishes once it
      #     has built. The last merge's run is always the tip, so the newest
      #     merge is never left unreleased.
      #   - A run behind the tip also skips inside the gap; the tip's run,
      #     queued behind it, releases its revision.
      # The gap only spaces restarts; it never decides which revision wins.
      # So when the newest release's run cannot be read, this publishes as
      # it did before. Feature-branch candidates and dispatched runs never
      # wait.
      #
      # Ten minutes became four on 10 October. A merge read "Going live" for
      # a median of 5.6 minutes and up to 16 that day, most of it this wait,
      # while what a restart cost had shrunk since 7 October: a checks run in
      # flight is collected by the harvest rather than run again (none was in
      # that day's eight restarts), and a bot turn resumes. What was left, a
      # boot rebuilding every preview that keeps failing, now waits out each
      # preview's own retry backoff (server.js recoverSessions).
      #
      # To release at once (an urgent fix), run this workflow on main by hand:
      #   gh workflow run build-kubernetes-images.yml --ref main
      # A dispatched run never waits, and a run waiting here when one is
      # queued behind it skips in its favour, so main goes out as soon as
      # the dispatched run has built, with a single restart.
      - name: Check branch tip before publishing
        id: current_head
        shell: bash
        # The wait is at most RELEASE_MIN_GAP_MINUTES; this only stops a hung
        # read from holding the release queue.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ steps.chart.outputs.release_channel }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
          CHART_REF: oci://ghcr.io/${{ steps.chart.outputs.registry_owner }}/charts/social-vibecoding-platform
          RELEASE_EVERY_MINUTES: '15'
          RELEASE_MIN_GAP_MINUTES: '4'
        run: |
          set -euo pipefail
          branch_tip() { git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1; }
          current_sha="$(branch_tip)"
          test -n "$current_sha"
          decide() {
            echo "publish=$1" >> "$GITHUB_OUTPUT"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # base...head: "ahead" when head contains base and more.
          compare() { gh api "repos/$GITHUB_REPOSITORY/compare/$1...$2" --jq .status 2>/dev/null || echo unknown; }
          merged_at() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq '.commit.committer.date | fromdateiso8601' 2>/dev/null || echo; }
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/build-kubernetes-images.yml/runs"
          gap=$(( RELEASE_MIN_GAP_MINUTES * 60 ))

          # The newest stable release in the registry, the one Argo CD runs.
          newest_release() {
            local chart
            chart="$(helm show chart "$CHART_REF" --version '0.1.*' 2>/dev/null || true)"
            published_sha="$(printf '%s\n' "$chart" | sed -n 's/^appVersion: *//p' | tr -d '"' | head -n 1)"
            published_version="$(printf '%s\n' "$chart" | sed -n 's/^version: *//p' | tr -d '"' | head -n 1)"
            [[ "$published_sha" =~ ^[a-f0-9]{40}$ && "$published_version" =~ ^0\.1\.[0-9]+$ ]]
          }
          # Seconds since the run that published the newest release finished,
          # or nothing when that cannot be read. Its chart is 0.1.<run number
          # * 1000 + attempt>; a later attempt of the same run only makes the
          # release look newer, so the wait errs long, never short.
          release_age() {
            local at
            at="$(gh api "$runs?head_sha=$published_sha&per_page=100" \
              --jq "[.workflow_runs[] | select(.run_number == $(( ${published_version##*.} / 1000 )) and .status == \"completed\") | .updated_at | fromdateiso8601][0] // empty" \
              2>/dev/null || true)"
            [[ "$at" =~ ^[0-9]+$ ]] || return 0
            at=$(( $(date +%s) - at ))
            echo $(( at < 0 ? 0 : at ))
          }
          # Dispatched runs of this workflow on this branch, queued after this
          # one. Unreadable counts as none.
          dispatched() {
            gh api "$runs?event=workflow_dispatch&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_branch == \"${GITHUB_REF#refs/heads/}\" and .status != \"completed\" and .run_number > $GITHUB_RUN_NUMBER)] | length" \
              2>/dev/null || echo 0
          }

          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            publishing="Publishing $GITHUB_SHA, the tip of $GITHUB_REF"
            [ "$RELEASE_CHANNEL" = stable ] || decide true "$publishing."
            [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] \
              || decide true "$publishing, at once: it was dispatched by hand."
            newest_release || decide true "$publishing; the newest release could not be read."
            age="$(release_age)"
            [ -n "$age" ] \
              || decide true "$publishing; when the newest release ($published_version) went out could not be read."
            [ "$age" -lt "$gap" ] \
              || decide true "$publishing: the newest release ($published_version) went out $(( age / 60 )) minutes ago."

            waited_from="$(date +%s)"
            wait_until=$(( waited_from + gap - age ))
            echo "The newest release ($published_version) went out $(( age / 60 )) minutes ago. Waiting up to $(( (gap - age + 59) / 60 )) more minutes, until it is $RELEASE_MIN_GAP_MINUTES minutes old. To release now, run this workflow on $GITHUB_REF by hand."
            while :; do
              [ "$(dispatched)" = 0 ] \
                || decide false "Skipping $GITHUB_SHA: a run of this workflow dispatched by hand is queued behind this one, and it publishes $GITHUB_REF without waiting."
              now="$(date +%s)"
              [ "$now" -lt "$wait_until" ] || break
              sleep $(( wait_until - now < 30 ? wait_until - now : 30 ))
              current_sha="$(branch_tip)" && [ -n "$current_sha" ] || current_sha="$GITHUB_SHA"
              [ "$current_sha" = "$GITHUB_SHA" ] \
                || decide false "Skipping $GITHUB_SHA: $GITHUB_REF moved to $current_sha while this run waited for the newest release ($published_version) to be $RELEASE_MIN_GAP_MINUTES minutes old. That commit's run is queued behind this one and publishes once it has built."
            done
            decide true "$publishing, after waiting $(( ($(date +%s) - waited_from + 30) / 60 )) minutes for the newest release ($published_version) to be $RELEASE_MIN_GAP_MINUTES minutes old."
          fi
          skipping="Skipping $GITHUB_SHA: $GITHUB_REF is now $current_sha"
          [ "$RELEASE_CHANNEL" = stable ] || decide false "$skipping."
          [ "$(compare "$GITHUB_SHA" "$current_sha")" = ahead ] \
            || decide false "$skipping, which does not contain it."

          newest_release || decide false "$skipping, and the newest release could not be read."
          [ "$(compare "$published_sha" "$GITHUB_SHA")" = ahead ] \
            || decide false "$skipping, and the newest release ($published_version, $published_sha) is not older than it."
          [ "${published_version##*.}" -lt "${CHART_VERSION##*.}" ] \
            || decide false "$skipping, and the newest release ($published_version) is numbered at or above $CHART_VERSION."

          this_at="$(merged_at "$GITHUB_SHA")"
          published_at="$(merged_at "$published_sha")"
          [[ "$this_at" =~ ^[0-9]+$ && "$published_at" =~ ^[0-9]+$ ]] \
            || decide false "$skipping, and when its revisions were merged could not be read."
          [ $(( this_at - published_at )) -ge $(( RELEASE_EVERY_MINUTES * 60 )) ] \
            || decide false "$skipping, and the newest release ($published_version) is less than $RELEASE_EVERY_MINUTES minutes older; a later run releases it."
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            age="$(release_age)"
            [ -z "$age" ] || [ "$age" -ge "$gap" ] \
              || decide false "$skipping, and the newest release ($published_version) went out $(( age / 60 )) minutes ago, under $RELEASE_MIN_GAP_MINUTES; the tip's run releases it."
          fi
          decide true "Publishing $GITHUB_SHA ahead of $GITHUB_REF's tip ($current_sha): the newest release ($published_version, $published_sha) is $(( (this_at - published_at) / 60 )) minutes older."

      - name: Log in to GHCR for Helm
        if: steps.current_head.outputs.publish == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish OCI Helm release
        if: steps.current_head.outputs.publish == 'true'
        run: |
          helm push "${{ steps.chart.outputs.package_path }}" \
            "oci://ghcr.io/${{ steps.chart.outputs.registry_owner }}/charts"

      # Argo CD learns of a new chart by re-reading the registry's tag list on
      # its reconcile interval — up to three minutes after the push, and the
      # single largest piece of the merge-to-running gap. A hard refresh makes
      # it re-read the registry now; automated sync takes it from there.
      #
      # Best effort, and that is load-bearing: services/release-watch.js reads
      # this run's conclusion, so a step that could fail the run would report a
      # release as stalled while the rollout proceeds on the periodic reconcile
      # exactly as before. An unconfigured token skips; a bad token, an Argo
      # outage or a timeout warn on the run and fall back to that reconcile.
      #
      # `refresh=hard` rather than `normal`: the repo-server caches the
      # resolved tag for the `0.1.*` range, and only a hard refresh bypasses it.
      # The request returns once Argo has compared the fresh manifests, so a
      # 200 means the sync is already underway. Only stable releases: Argo
      # tracks `0.1.*`, so a `feat-k8s` candidate has nothing to refresh.
      - name: Ask Argo CD to pick up the release now
        if: steps.current_head.outputs.publish == 'true' && steps.chart.outputs.release_channel == 'stable' && env.ARGOCD_REFRESH_TOKEN != ''
        continue-on-error: true
        env:
          ARGOCD_SERVER: argocd.platform.beta.usernodelabs.org
          ARGOCD_APPLICATION: social-vibecoding-platform
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 120 \
            --header "Authorization: Bearer ${ARGOCD_REFRESH_TOKEN}" \
            "https://${ARGOCD_SERVER}/api/v1/applications/${ARGOCD_APPLICATION}?refresh=hard")" \
            || status="curl exit $?"
          if [ "$status" = "200" ]; then
            echo "Argo CD re-read the chart registry and compared ${ARGOCD_APPLICATION}."
            echo '- Argo CD: refreshed `'"${ARGOCD_APPLICATION}"'` on publish; no reconcile wait' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Argo CD refresh not confirmed::${ARGOCD_APPLICATION} refresh returned '${status}'. The release still lands on Argo CD's periodic reconcile (up to three minutes). 401 means ARGOCD_REFRESH_TOKEN expired or was revoked; 403 means the project role changed — see the infra runbook."
          echo '- Argo CD: refresh not confirmed (`'"${status}"'`); landing on the periodic reconcile' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Record atomic release
        if: steps.current_head.outputs.publish == 'true'
        run: |
          echo '## Atomic Kubernetes release' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Channel: `${{ steps.chart.outputs.release_channel }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Chart: `oci://ghcr.io/${{ steps.chart.outputs.registry_owner }}/charts/social-vibecoding-platform:${{ steps.chart.outputs.chart_version }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Argo tracks only stable `0.1.*` releases; feature builds publish `0.0.*-feat-k8s` candidates.' >> "$GITHUB_STEP_SUMMARY"
