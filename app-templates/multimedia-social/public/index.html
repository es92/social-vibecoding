<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{DEV_CONSOLE_FORWARDER}}
  <title>{{APP_NAME}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- This app's precompiled Tailwind (npm run build writes it on every
       image build; tailwind.config.js says which files it scans). -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Never vendor it and never write a hostname in front of it. It is also
       how the app answers the shell, so keep it even if no bridge API is
       called. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen">
  <main class="max-w-lg mx-auto px-4 py-8 flex flex-col gap-5">
    <header class="flex flex-col gap-1">
      <h1 class="text-2xl font-bold">{{APP_NAME}}</h1>
      <p class="text-sm text-zinc-500 dark:text-zinc-400">Share what you are up to, with a photo if you like.</p>
    </header>

    <!-- usernode-starter-notice@1: the "started from a template" notice.
         Remove this whole block, both sentinel comments included, with the
         first real change. -->
    <p class="rounded-xl bg-violet-50 text-violet-900 dark:bg-violet-500/10 dark:text-violet-200 text-sm px-4 py-3">
      Started from the Multimedia social template. To change this app, ask Homeroom bot: tap the Homeroom icon, then <strong class="font-semibold">Ask for a change</strong>.
    </p>
    <!-- /usernode-starter-notice@1 -->

    <form id="composer" class="rounded-2xl bg-white dark:bg-zinc-900 ring-1 ring-zinc-200 dark:ring-zinc-800 overflow-hidden">
      <textarea name="caption" rows="3" maxlength="500" placeholder="What's new?" aria-label="Caption"
        class="block w-full resize-none bg-transparent px-4 pt-3 pb-2 text-[15px] placeholder:text-zinc-400 focus:outline-none"></textarea>
      <div id="photo-preview" class="relative px-4 pb-2" hidden>
        <img alt="The photo you picked" class="max-h-64 rounded-xl object-cover">
        <button type="button" id="photo-remove" aria-label="Remove photo"
          class="absolute top-2 left-6 h-7 w-7 rounded-full bg-black/60 text-white text-sm">&times;</button>
      </div>
      <div class="flex items-center gap-2 border-t border-zinc-100 dark:border-zinc-800 px-3 py-2">
        <label class="cursor-pointer rounded-full px-3 py-1.5 text-[14px] font-semibold text-violet-600 dark:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-500/10">
          Add photo
          <input id="photo-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="sr-only">
        </label>
        <span id="composer-note" class="flex-1 min-w-0 truncate text-[13px] text-zinc-500 dark:text-zinc-400"></span>
        <button type="submit" id="post-btn" class="shrink-0 rounded-full bg-violet-600 hover:bg-violet-500 disabled:opacity-50 text-white font-semibold px-4 py-1.5 text-[15px]">Post</button>
      </div>
    </form>

    <p id="status" class="text-sm text-red-600 dark:text-red-400" role="alert" hidden></p>

    <section id="feed" class="flex flex-col gap-4" aria-live="polite">
      <p class="text-sm text-zinc-500 dark:text-zinc-400" data-loading>Loading posts…</p>
    </section>
    <button type="button" id="more-btn" class="self-center rounded-full bg-white dark:bg-zinc-900 ring-1 ring-zinc-200 dark:ring-zinc-800 px-4 py-2 text-[14px] font-semibold" hidden>Show older posts</button>
  </main>

  <script src="/app.js"></script>
</body>
</html>
