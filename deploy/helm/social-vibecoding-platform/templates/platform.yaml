{{- if and .Values.enabled .Values.platform.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
  annotations:
    # After the Deployments (wave 0) are healthy: a selector that starts to
    # require serves-requests (the conductor switched on, the release that
    # first labels the serving Pods) is applied only once the Pods carrying
    # it are rolled out and Ready, never while only the old ones serve.
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    {{- include "social-vibecoding-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform
    {{- if .Values.platform.conductor.enabled }}
    # The conductor's Pods share the platform's identity (its network
    # policies, its PodDisruptionBudget) but take no requests: only the Pods
    # that serve them carry this label (docs/plans/web-and-conductor.md).
    social.usernode.io/serves-requests: "true"
    {{- end }}
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  replicas: {{ .Values.platform.replicas }}
  revisionHistoryLimit: 5
  # Kubernetes' Deployment controller supplies the two rollout colors as
  # old/new ReplicaSets. The new color must stay ready before it counts as
  # available, while maxUnavailable=0 keeps the old color serving until then.
  # Ten seconds, not five: on 6 Nov 2026 a new web Pod failed its own liveness
  # check one second before it was declared Ready, and the release then sent
  # every tab to that cold process (issue #6403).
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
  template:{{ include "social-vibecoding-platform.platformPod" (merge (dict "processRole" (ternary "web" "" .Values.platform.conductor.enabled)) .) }}
{{- if .Values.platform.conductor.enabled }}
---
# The conductor (docs/plans/web-and-conductor.md): the same image and Pod as
# above, run as PROCESS_ROLE=conductor. Every replica runs the workflow
# (docs/workflows.md), none of it needing the leader lock; one also stands as
# leader for the leader's remaining work. The Pods above serve people's
# requests, never lead and decide nothing. Its Pods carry the platform's
# component label, so every network policy that admits the platform admits
# it; its own selector adds process-role, and the Service above leaves it
# out. A release replaces it as it replaces them: a new one first, then an
# old one finishes its work (docs/plans/draining-releases.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}-conductor
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
    social.usernode.io/process-role: conductor
spec:
  replicas: {{ .Values.platform.conductor.replicas }}
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
      social.usernode.io/process-role: conductor
  template:{{ include "social-vibecoding-platform.platformPod" (merge (dict "processRole" "conductor") .) }}
{{- end }}
{{- end }}

{{- /*
The platform's Pod, for the Deployment above and the conductor's. Called with
the chart's context plus processRole: "" (all: serves and stands for leader),
"web" or "conductor".
*/}}
{{- define "social-vibecoding-platform.platformPod" }}
    metadata:
      annotations:
        checksum/secrets: {{ toYaml .Values.secrets | sha256sum }}
        social.usernode.io/source-revision: {{ .Values.release.sourceRevision | quote }}
      labels:
        {{- include "social-vibecoding-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform
        social.usernode.io/process-role: {{ .processRole | default "all" | quote }}
        {{- if ne .processRole "conductor" }}
        social.usernode.io/serves-requests: "true"
        {{- end }}
    spec:
      {{- $account := "social-platform-runtime" }}
      {{- if and (eq .processRole "web") .Values.platform.web.serviceAccountName }}
      {{- $account = .Values.platform.web.serviceAccountName }}
      {{- end }}
      serviceAccountName: {{ $account }}
      automountServiceAccountToken: true
      {{- with include "social-vibecoding-platform.databasePrimaryAffinity" . }}
      {{- . | nindent 6 }}
      {{- end }}
      # A Pod a release replaced keeps finishing the work it started for up
      # to platform.drainMinutes, then hands the rest over and exits
      # (docs/plans/draining-releases.md). The 60 seconds on top are the
      # preStop sleep and the bounded steps after the drain.
      terminationGracePeriodSeconds: {{ add (mul (int .Values.platform.drainMinutes) 60) 60 }}
      {{- if eq .processRole "conductor" }}
      # The conductor's replicas on different nodes where it can: losing a
      # node then leaves one running the workflow.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "social-vibecoding-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: platform
              social.usernode.io/process-role: conductor
      {{- end }}
      # The pause container is PID 1 and reaps zombies, as `--init` does on
      # Docker (src/services/docker.js). Node as PID 1 never reaped the
      # orphaned `git` processes it spawns: the conductor held 824 zombies
      # after 14 minutes and the platform reached 61,783 PIDs (Oct 2026),
      # all counted against the kubelet's per-Pod PID limit. SIGTERM still
      # reaches Node, whose handler starts the drain.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform
          image: {{ include "social-vibecoding-platform.image" .Values.platform.image | quote }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          securityContext:
            {{- include "social-vibecoding-platform.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: social-build-policy
            - secretRef:
                name: {{ include "social-vibecoding-platform.secretName" . }}
            {{- if and (eq .processRole "conductor") (include "social-vibecoding-platform.conductorSecret" .) }}
            # What only the conductor may hold (templates/secret.yaml).
            - secretRef:
                name: {{ include "social-vibecoding-platform.fullname" . }}-conductor
            {{- end }}
            {{- if and (eq .processRole "conductor") .Values.databaseRoles.enabled (not .Values.secrets.create) }}
            - secretRef:
                name: {{ .Values.databaseRoles.existingConductorSecret }}
            {{- end }}
          env:
            {{- include "social-vibecoding-platform.databaseRoleEnv" . | nindent 12 }}
            {{- if .Values.databaseRoles.enabled }}
            - {name: POSTGRES_PASSWORD, value: ""}
            - {name: DATABASE_BOOTSTRAP_URL, value: ""}
            - {name: STAGING_DATABASE_BOOTSTRAP_URL, value: ""}
            {{- if eq .processRole "web" }}
            - {name: DB_ADMIN_URL, value: ""}
            {{- if .Values.previewPostgresql.enabled }}
            - {name: STAGING_DB_ADMIN_URL, value: ""}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq .processRole "web" }}
            # Also mask writer keys in an operator-supplied existing Secret.
            - {name: GITHUB_PRIVATE_KEY, value: ""}
            - {name: GIT_HOST_TOKEN, value: ""}
            {{- end }}
            - name: PLATFORM_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: PLATFORM_DEPLOYMENT
              value: {{ include "social-vibecoding-platform.fullname" . | quote }}
            - {name: NODE_ENV, value: production}
            {{- with .processRole }}
            # web or conductor (src/services/process-role.js); unset is all.
            - {name: PROCESS_ROLE, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.platform.nodeOptions }}
            - {name: NODE_OPTIONS, value: {{ . | quote }}}
            {{- end }}
            - {name: PORT, value: "3000"}
            - {name: APP_RUNTIME, value: kubernetes}
            - {name: SHOTS_ENABLED, value: {{ .Values.platform.shotsEnabled | quote }}}
            - {name: WORKER_RUNTIME, value: kubernetes}
            - {name: CAPTURE_RUNTIME, value: kubernetes}
            {{- $previewCluster := "" }}
            {{- $previewNamespace := "" }}
            {{- if and .Values.config.previewFollowDatabasePrimary (not .Values.postgresql.enabled) }}
              {{- $previewCluster = index .Values.postgresql.podSelector "cnpg.io/cluster" | default "" }}
              {{- if $previewCluster }}
                {{- $previewNamespace = default .Release.Namespace .Values.postgresql.namespace }}
              {{- end }}
            {{- end }}
            # Explicit empty values also override imported config when disabled.
            - {name: PREVIEW_DATABASE_NAMESPACE, value: {{ $previewNamespace | quote }}}
            - {name: PREVIEW_DATABASE_CLUSTER, value: {{ $previewCluster | quote }}}
            {{- if .Values.previewPostgresql.enabled }}
            # STAGING_DB_ADMIN_URL itself comes from the Secret: it carries a password.
            - {name: STAGING_DB_SERVER_DRAIN, value: {{ ternary "1" "" (.Values.previewPostgresql.drain | default false) | quote }}}
            {{- else }}
            # An explicit empty value overrides a key left in the imported Secret.
            - {name: STAGING_DB_ADMIN_URL, value: ""}
            - {name: STAGING_DB_READ_URL, value: ""}
            {{- end }}
            - {name: RUN_MIGRATIONS_ON_STARTUP, value: "false"}
            # During the rollout overlap both old and new platform Pods serve
            # HTTP, but only the Postgres advisory-lock leader runs singleton
            # recovery, sweepers and reconcilers.
            - {name: PLATFORM_LEADER_LOCK, value: "1"}
            # How long a replaced Pod finishes its work, and how many may at
            # once (docs/plans/draining-releases.md).
            - {name: PLATFORM_DRAIN_TIMEOUT_MS, value: {{ mul (int .Values.platform.drainMinutes) 60000 | quote }}}
            - {name: PLATFORM_DRAINING_MAX, value: {{ int .Values.platform.drainingMax | quote }}}
            - {name: GIT_SHA, value: {{ .Values.release.sourceRevision | quote }}}
            - {name: USERNODE_DOMAIN, value: {{ .Values.config.domain | quote }}}
            - {name: USERNODE_APPS_DOMAIN, value: {{ default .Values.config.domain .Values.config.appsDomain | quote }}}
            - {name: APP_GATE, value: {{ .Values.config.appGate | default "on" | quote }}}
            - {name: APP_HOST_SIGNIN, value: {{ .Values.config.appHostSignin | default "on" | quote }}}
            - {name: APP_OFFLINE_CACHE, value: {{ .Values.config.appOfflineCache | default "on" | quote }}}
            - {name: CLI_CANONICAL_ORIGIN, value: {{ printf "https://%s" .Values.config.domain | quote }}}
            - {name: WAITLIST_OAUTH_ORIGIN, value: {{ .Values.config.waitlistOauthOrigin | quote }}}
            - {name: PLATFORM_INTERNAL_URL, value: {{ .Values.config.internalUrl | quote }}}
            - {name: MEDIA_STORAGE_ENDPOINT, value: {{ .Values.config.mediaStorage.endpoint | default "" | quote }}}
            - {name: MEDIA_STORAGE_BUCKET, value: {{ .Values.config.mediaStorage.bucket | default "" | quote }}}
            - {name: USERNODE_PLATFORM_REPO, value: {{ .Values.config.platformRepository | quote }}}
            # Homeroom's own git host (services/git-host.js): app repositories
            # since GitHub suspended the account that held them. Its token is
            # in the Secret (GIT_HOST_TOKEN).
            - {name: GIT_HOST_URL, value: {{ .Values.config.gitHost.url | quote }}}
            - {name: GIT_HOST_INTERNAL_URL, value: {{ .Values.config.gitHost.internalUrl | quote }}}
            - {name: GIT_HOST_ORG, value: {{ .Values.config.gitHost.org | quote }}}
            - {name: GIT_HOST_USER, value: {{ .Values.config.gitHost.user | quote }}}
            - {name: GIT_HOST_READ_USER, value: {{ .Values.config.gitHost.readUser | default .Values.config.gitHost.user | quote }}}
            - {name: NODE_RPC_URL, value: {{ .Values.config.nodeRpcUrl | quote }}}
            - {name: EXPLORER_UPSTREAM, value: {{ .Values.config.explorerUpstream | quote }}}
            - {name: EXPLORER_UPSTREAM_BASE, value: {{ .Values.config.explorerUpstreamBase | quote }}}
            - {name: EXPLORER_USE_HTTP, value: {{ .Values.config.explorerUseHttp | quote }}}
            - {name: NATIVE_SESSION_V2_TESTNET_CHAIN_ID, value: {{ .Values.config.nativeSessionV2TestnetChainId | quote }}}
            - {name: LOG_LEVEL, value: {{ .Values.config.logLevel | quote }}}
            - {name: FIREBASE_PHONE_AUTH_ENABLED, value: {{ .Values.config.firebasePhoneAuthEnabled | quote }}}
            - {name: PREVIEW_PROJECTS_ENABLED, value: {{ .Values.config.previewProjects | quote }}}
            {{- if .Values.secrets.create }}
            # Whether managed OpenRouter keys are offered, said without the key,
            # which the web Pods do not hold (src/services/openrouter-managed-keys.js).
            - {name: OPENROUTER_MANAGED_KEYS_ENABLED, value: {{ ternary "true" "false" (not (empty .Values.secrets.openrouterManagementApiKey)) | quote }}}
            {{- end }}
            - {name: WORKER_MEMORY, value: {{ .Values.config.workerMemory | quote }}}
            - {name: WORKER_MEMORY_PLATFORM_REPO, value: {{ .Values.config.workerMemoryPlatformRepo | quote }}}
            - {name: PLATFORM_SIGNALS, value: {{ .Values.config.platformSignals.mode | default "shadow" | quote }}}
            - {name: PLATFORM_SIGNALS_KINDS, value: {{ .Values.config.platformSignals.kinds | default "" | quote }}}
            - {name: PLATFORM_SIGNALS_BOT, value: {{ .Values.config.platformSignals.bot | default "on" | quote }}}
            - {name: PLATFORM_SIGNALS_SECURITY_AUDIT, value: {{ .Values.config.platformSignals.securityAudit | default "off" | quote }}}
            - {name: WORKER_CPUS, value: {{ .Values.config.workerCpus | quote }}}
            - {name: CAPTURE_MEMORY, value: {{ .Values.config.captureMemory | quote }}}
            - {name: CAPTURE_CPUS, value: {{ .Values.config.captureCpus | quote }}}
            - {name: CHECKS_MAX_CONCURRENT_RUNS, value: {{ .Values.config.checksMaxConcurrentRuns | int64 | quote }}}
            - {name: CHECK_NODE_POOL, value: {{ .Values.config.checkNodePool | quote }}}
            - {name: CHECK_NODE_POOL_REQUIRED, value: {{ .Values.config.checkNodePoolRequired | quote }}}
            {{- if .Values.config.checkNodePoolRequired }}
            # Speculative early suites do not own a shared checks-queue slot.
            # Required-pool mode runs their suite in the admitted checks run.
            - {name: EARLY_UNIT_SUITE, value: "0"}
            {{- end }}
            - {name: CHECK_POOL_METRICS_URL, value: {{ .Values.config.checkPoolMetricsUrl | quote }}}
            - {name: KUBERNETES_APP_RESOURCE_PROFILES, value: {{ .Values.config.appResourceProfiles | toJson | quote }}}
            - {name: PREVIEW_SLEEP_AFTER_MS, value: {{ .Values.config.previewSleepAfterMs | int64 | toString | quote }}}
            - {name: APP_SLEEP_APP_IDS, value: {{ join "," .Values.config.appSleepAppIds | quote }}}
            - {name: APP_SLEEP_AFTER_MS, value: {{ .Values.config.appSleepAfterMs | int64 | toString | quote }}}
            {{- if and (eq .processRole "conductor") .Values.platform.conductor.dbPoolMax }}
            - {name: DB_POOL_MAX, value: {{ .Values.platform.conductor.dbPoolMax | int64 | quote }}}
            {{- else }}
            - {name: DB_POOL_MAX, value: {{ .Values.config.dbPoolMax | int64 | quote }}}
            {{- end }}
            # The rest of the connection budget (postgresql.platformConnections):
            # the workflow pool and db-manager's operations, the conductor's
            # work's sizes where this Pod does it, and what a replaced Pod keeps.
            {{- $conductorWork := or (eq .processRole "conductor") (not .Values.platform.conductor.enabled) }}
            - {name: WF_POOL_MAX, value: {{ ternary .Values.platform.conductor.wfPoolMax .Values.config.wfPoolMax $conductorWork | int64 | quote }}}
            - {name: DB_ADMIN_CONNECTIONS_MAX, value: {{ ternary .Values.platform.conductor.databaseOperations .Values.config.databaseOperations $conductorWork | int64 | quote }}}
            - {name: DRAIN_DB_POOL_MAX, value: {{ .Values.platform.drainPools.dbPoolMax | int64 | quote }}}
            - {name: DRAIN_WF_POOL_MAX, value: {{ .Values.platform.drainPools.wfPoolMax | int64 | quote }}}
            - {name: DB_ADMIN_CONNECTIONS_DRAINING, value: {{ .Values.platform.drainPools.databaseOperations | int64 | quote }}}
            {{- if and (eq .processRole "conductor") .Values.platform.conductor.metricsPort }}
            # The workflow's metrics (src/workflow/metrics.ts).
            - {name: WF_METRICS_PORT, value: {{ .Values.platform.conductor.metricsPort | int64 | quote }}}
            {{- end }}
            - {name: MAX_GLOBAL_SESSIONS, value: {{ .Values.config.maxGlobalSessions | int64 | quote }}}
            - {name: MAX_USER_SESSIONS, value: {{ .Values.config.maxUserSessions | int64 | quote }}}
            - {name: MAX_USER_PROMOTED_SESSIONS, value: {{ .Values.config.maxUserPromotedSessions | int64 | quote }}}
            - {name: MAX_ADMIN_USER_SESSIONS, value: {{ .Values.config.maxAdminUserSessions | int64 | quote }}}
            - {name: MAX_ADMIN_USER_PROMOTED_SESSIONS, value: {{ .Values.config.maxAdminUserPromotedSessions | int64 | quote }}}
            - {name: WORKER_IDLE_EVICTION_MS, value: {{ .Values.config.workerIdleEvictionMs | int64 | quote }}}
            - {name: SESSION_AUTOPAUSE_IDLE_MS, value: {{ .Values.config.sessionAutopauseIdleMs | int64 | quote }}}
            - {name: STAGING_IDLE_TEARDOWN_MS, value: {{ .Values.config.stagingIdleTeardownMs | int64 | quote }}}
            - {name: KUBERNETES_WORKER_IMAGE, value: {{ include "social-vibecoding-platform.image" .Values.platform.workerImage | quote }}}
            - {name: KUBERNETES_CAPTURE_IMAGE, value: {{ include "social-vibecoding-platform.image" .Values.platform.captureImage | quote }}}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
            {{- if and (eq .processRole "conductor") .Values.platform.conductor.metricsPort }}
            - {name: metrics, containerPort: {{ .Values.platform.conductor.metricsPort | int64 }}, protocol: TCP}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            # Every second, so a Pod that has started listening is seen within
            # one: the rollout waits on it.
            periodSeconds: 1
            timeoutSeconds: 2
            # 300s, as before: the 180s security barrier plus ordinary boot/drain work.
            failureThreshold: 300
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            # Two answers in a row before a Pod counts as ready; the conductor
            # keeps one. On 6 Nov 2026 a web Pod failed liveness one second
            # before a single answer made it the only server, so one quick
            # answer is not proof it can serve the release's traffic (#6403).
            successThreshold: {{ ternary 1 2 (eq .processRole "conductor") }}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}
          resources:
            {{- if and (eq .processRole "conductor") .Values.platform.conductor.resources }}
            {{- toYaml .Values.platform.conductor.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.platform.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.platform.tmpSizeLimit | quote }}
{{- end -}}
