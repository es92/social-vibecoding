{{- if and .Values.enabled .Values.platform.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  type: ClusterIP
  selector:
    {{- include "social-vibecoding-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-vibecoding-platform.fullname" . }}
  labels:
    {{- include "social-vibecoding-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  replicas: {{ .Values.platform.replicas }}
  revisionHistoryLimit: 5
  # Kubernetes' Deployment controller supplies the two rollout colors as
  # old/new ReplicaSets. The new color must stay ready before it counts as
  # available, while maxUnavailable=0 keeps the old color serving until then.
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "social-vibecoding-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
  template:
    metadata:
      annotations:
        checksum/secrets: {{ toYaml .Values.secrets | sha256sum }}
        social.usernode.io/source-revision: {{ .Values.release.sourceRevision | quote }}
      labels:
        {{- include "social-vibecoding-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform
    spec:
      serviceAccountName: social-platform-runtime
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: platform
          image: {{ include "social-vibecoding-platform.image" .Values.platform.image | quote }}
          imagePullPolicy: {{ .Values.platform.image.pullPolicy }}
          securityContext:
            {{- include "social-vibecoding-platform.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: social-build-policy
            - secretRef:
                name: {{ include "social-vibecoding-platform.secretName" . }}
          env:
            - name: PLATFORM_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: PLATFORM_DEPLOYMENT
              value: {{ include "social-vibecoding-platform.fullname" . | quote }}
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: APP_RUNTIME, value: kubernetes}
            - {name: PREVIEW_LIFECYCLE_ENABLED, value: {{ .Values.platform.previewLifecycleEnabled | default false | quote }}}
            - {name: WORKER_RUNTIME, value: kubernetes}
            - {name: CAPTURE_RUNTIME, value: kubernetes}
            {{- $previewCluster := "" }}
            {{- $previewNamespace := "" }}
            {{- if and .Values.config.previewFollowDatabasePrimary (not .Values.postgresql.enabled) }}
              {{- $previewCluster = index .Values.postgresql.podSelector "cnpg.io/cluster" | default "" }}
              {{- if $previewCluster }}
                {{- $previewNamespace = default .Release.Namespace .Values.postgresql.namespace }}
              {{- end }}
            {{- end }}
            # Explicit empty values also override imported config when disabled.
            - {name: PREVIEW_DATABASE_NAMESPACE, value: {{ $previewNamespace | quote }}}
            - {name: PREVIEW_DATABASE_CLUSTER, value: {{ $previewCluster | quote }}}
            - {name: RUN_MIGRATIONS_ON_STARTUP, value: "false"}
            # During the rollout overlap both old and new platform Pods serve
            # HTTP, but only the Postgres advisory-lock leader runs singleton
            # recovery, sweepers and reconcilers.
            - {name: PLATFORM_LEADER_LOCK, value: "1"}
            - {name: GIT_SHA, value: {{ .Values.release.sourceRevision | quote }}}
            - {name: USERNODE_DOMAIN, value: {{ .Values.config.domain | quote }}}
            - {name: USERNODE_APPS_DOMAIN, value: {{ default .Values.config.domain .Values.config.appsDomain | quote }}}
            - {name: CLI_CANONICAL_ORIGIN, value: {{ printf "https://%s" .Values.config.domain | quote }}}
            - {name: PLATFORM_INTERNAL_URL, value: {{ .Values.config.internalUrl | quote }}}
            - {name: USERNODE_PLATFORM_REPO, value: {{ .Values.config.platformRepository | quote }}}
            - {name: NODE_RPC_URL, value: {{ .Values.config.nodeRpcUrl | quote }}}
            - {name: EXPLORER_UPSTREAM, value: {{ .Values.config.explorerUpstream | quote }}}
            - {name: EXPLORER_UPSTREAM_BASE, value: {{ .Values.config.explorerUpstreamBase | quote }}}
            - {name: EXPLORER_USE_HTTP, value: {{ .Values.config.explorerUseHttp | quote }}}
            - {name: NATIVE_SESSION_V2_TESTNET_CHAIN_ID, value: {{ .Values.config.nativeSessionV2TestnetChainId | quote }}}
            - {name: LOG_LEVEL, value: {{ .Values.config.logLevel | quote }}}
            - {name: WORKER_MEMORY, value: {{ .Values.config.workerMemory | quote }}}
            - {name: WORKER_CPUS, value: {{ .Values.config.workerCpus | quote }}}
            - {name: CAPTURE_MEMORY, value: {{ .Values.config.captureMemory | quote }}}
            - {name: CAPTURE_CPUS, value: {{ .Values.config.captureCpus | quote }}}
            - {name: DB_POOL_MAX, value: {{ .Values.config.dbPoolMax | int64 | quote }}}
            - {name: MAX_GLOBAL_SESSIONS, value: {{ .Values.config.maxGlobalSessions | int64 | quote }}}
            - {name: MAX_USER_SESSIONS, value: {{ .Values.config.maxUserSessions | int64 | quote }}}
            - {name: MAX_USER_PROMOTED_SESSIONS, value: {{ .Values.config.maxUserPromotedSessions | int64 | quote }}}
            - {name: MAX_ADMIN_USER_SESSIONS, value: {{ .Values.config.maxAdminUserSessions | int64 | quote }}}
            - {name: MAX_ADMIN_USER_PROMOTED_SESSIONS, value: {{ .Values.config.maxAdminUserPromotedSessions | int64 | quote }}}
            - {name: WORKER_IDLE_EVICTION_MS, value: {{ .Values.config.workerIdleEvictionMs | int64 | quote }}}
            - {name: SESSION_AUTOPAUSE_IDLE_MS, value: {{ .Values.config.sessionAutopauseIdleMs | int64 | quote }}}
            - {name: STAGING_IDLE_TEARDOWN_MS, value: {{ .Values.config.stagingIdleTeardownMs | int64 | quote }}}
            - {name: KUBERNETES_WORKER_IMAGE, value: {{ include "social-vibecoding-platform.image" .Values.platform.workerImage | quote }}}
            - {name: KUBERNETES_CAPTURE_IMAGE, value: {{ include "social-vibecoding-platform.image" .Values.platform.captureImage | quote }}}
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.platform.tmpSizeLimit | quote }}
{{- end }}
