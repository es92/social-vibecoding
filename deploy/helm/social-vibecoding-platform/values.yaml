enabled: false

nameOverride: ""
fullnameOverride: social-vibecoding

imagePullSecrets: []

# DNS suffix used for cross-namespace Service addresses. Keep this aligned
# with the Kubernetes cluster's configured cluster domain.
clusterDomain: cluster.local

# Populated in values.release.yaml by the image build workflow before the
# immutable OCI chart is packaged. Cluster values must not override it.
release:
  sourceRevision: ""

platform:
  enabled: true
  # Before & after shots are on by default. Set false only as an emergency
  # kill switch; legacy default-root screenshots stay suppressed. This was
  # visualEvidenceV2Enabled before the rename; that key is no longer read.
  shotsEnabled: true
  # How long a platform Pod a release replaced keeps finishing the work it
  # started (turns and what follows them, previews, checks, shots runs,
  # merges) before it hands the rest over and exits. It exits as soon as it
  # holds nothing, so this is a ceiling, not a cost; the Pod's grace period
  # is this plus a minute (docs/plans/draining-releases.md).
  drainMinutes: 40
  # How many replaced Pods may finish work at once, beside the one serving.
  # When releases come faster than work finishes, the oldest hands its work
  # over first rather than keep one Pod per release.
  drainingMax: 2
  # What a replaced Pod keeps while it finishes its work: it starts nothing
  # new, so its pools shrink to these (DRAIN_DB_POOL_MAX, DRAIN_WF_POOL_MAX,
  # DB_ADMIN_CONNECTIONS_DRAINING). The connection budget
  # (postgresql.platformConnections) counts drainingMax of them per replica
  # at these sizes.
  drainPools:
    dbPoolMax: 4
    wfPoolMax: 2
    databaseOperations: 1
  replicas: 1
  # The web and conductor split (docs/plans/web-and-conductor.md). On, the
  # Pods above serve people's requests, never lead and decide nothing
  # (PROCESS_ROLE=web: they append and wait for outcomes), and a Deployment
  # of its own runs the conductor (PROCESS_ROLE=conductor): the workflow
  # (every machine's pipeline slots, timers and work, docs/workflows.md) on
  # every replica, and the leader's remaining work (its timers, sweeps,
  # bench lane) on the one that leads, on Pods the Service sends no requests
  # to. Off, the Pods above do everything, as they always did. Either way
  # round, the Service's selector changes only after the Deployments are
  # healthy (its Argo CD sync wave), so the release that flips it keeps serving.
  conductor:
    enabled: true
    # Each replica runs the workflow; a kind's work limit holds across them
    # all, so a second one is for failover, not more at once. One leads.
    replicas: 1
    # Empty: the platform's resources above.
    resources: {}
    # Its own request pool (DB_POOL_MAX): it serves nobody's requests.
    dbPoolMax: 30
    # Its workflow pool (WF_POOL_MAX): the pipeline slots, the outcome
    # listener, work leases and results.
    wfPoolMax: 10
    # db-manager's database operations on the main server at once (a clone,
    # a teardown, a restore; DB_ADMIN_CONNECTIONS_MAX), each a connection or
    # two outside the pools.
    databaseOperations: 4
    # The workflow's metrics (GET /metrics, src/workflow/metrics.ts), on a
    # port of their own that the Service does not expose.
    metricsPort: 9464
  # The Pods that serve requests (PROCESS_ROLE=web, with the conductor on).
  # They change nothing in the cluster: the conductor does
  # (docs/plans/web-and-conductor.md). serviceAccountName gives them an
  # account of their own, which the cluster grants only reads (the infra
  # repository's social-vibecoding-foundation chart owns it and its Roles).
  # Empty: social-platform-runtime, the conductor's.
  web:
    serviceAccountName: ""
  image:
    repository: ghcr.io/replace-me/social-vibecoding-platform
    digest: ""
    pullPolicy: IfNotPresent
  workerImage:
    repository: ghcr.io/replace-me/social-vibecoding-worker
    digest: ""
  captureImage:
    repository: ghcr.io/replace-me/social-vibecoding-capture
    digest: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "4"
      memory: 3Gi
      ephemeral-storage: 4Gi
  # Node's heap ceiling for the platform process. Without it Node stops at
  # about 1.5 GB whatever limits.memory says, and on 2026-09-25 the platform
  # crash-looped on "JavaScript heap out of memory" with half its container
  # unused. Keep it below limits.memory: buffers, code and stacks live outside
  # the heap. An empty value leaves Node's default.
  nodeOptions: "--max-old-space-size=2304"
  tmpSizeLimit: 2Gi

postgresql:
  # Deploy the chart-owned StatefulSet by default. Set enabled=false and host
  # to use an externally managed PostgreSQL cluster such as CloudNativePG.
  enabled: true
  host: ""
  port: 5432
  # Selects external PostgreSQL Pods for platform and migration egress.
  # Leave namespace empty when PostgreSQL runs in the release namespace.
  namespace: ""
  podSelector: {}
  image:
    repository: postgres
    tag: 17-bookworm
    digest: sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
    pullPolicy: IfNotPresent
  database: usernode
  applicationDatabase: app_usernode_2d5619
  username: usernode
  # The connection budget. The connections the main server keeps from
  # ordinary roles (its reserved_connections): the child apps cannot take
  # them, and the platform's user, a superuser, is never held to them.
  # The chart refuses pools that could open more than this at once: every
  # role's serving Pods plus one more each for a rollout's surge, drainingMax
  # replaced Pods per replica at platform.drainPools, and the migration Job.
  # 0 checks nothing (the bundled server, a local cluster).
  platformConnections: 0
  storage:
    size: 50Gi
    storageClassName: openebs-lvm-retain
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  sharedMemorySizeLimit: 1Gi

# A second PostgreSQL server that holds preview databases only: the redacted
# staging templates, each preview's copy, and the copies before & after shots
# use. Off by default, and with it off nothing changes. The chart does not
# create the server; docs/kubernetes-operations.md ("A separate server for
# preview databases") lists what the cluster has to provide and how to switch
# it on and off.
#
# The platform reads the server's address and credential from
# STAGING_DB_ADMIN_URL. With secrets.create=true the chart writes it from the
# values below and secrets.previewDatabasePassword; with an existing Secret,
# add that key to it yourself. Either way `enabled` is the switch: while it
# is false the chart sets STAGING_DB_ADMIN_URL to an empty value on the
# platform, which overrides a key left in the Secret.
previewPostgresql:
  enabled: false
  # First step of switching back: new preview databases are made on the main
  # server again while the ones already on this server are still cleaned up.
  # Set enabled=false once those previews have expired.
  drain: false
  host: ""
  port: 5432
  # Selects the server's Pods for the platform's egress. Leave namespace
  # empty when it runs in the release namespace.
  namespace: ""
  podSelector: {}
  # The database administrative statements connect to; it must exist.
  database: postgres
  username: ""

# Separate PostgreSQL 16+ identities on externally managed database servers.
# The bootstrap Job runs before the schema migrator and serving workloads.
databaseRoles:
  enabled: false
  web: homeroom_web
  conductor: homeroom_conductor
  migrator: homeroom_migrator
  provisioner: homeroom_provisioner
  existingConductorSecret: ""
  existingMigrationSecret: ""
  existingBootstrapSecret: ""

migration:
  enabled: true
  # The migration Job's pool (DB_POOL_MAX); it also opens one administrative
  # connection and a psql. It runs beside every Pod of a rollout.
  dbPoolMax: 4
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi

config:
  # Prefer the external CNPG primary's zone for previews, production apps and
  # the platform's own Pods (web and conductor), with normal scheduler
  # fallback. Uses postgresql.namespace and podSelector["cnpg.io/cluster"].
  # No effect for bundled PostgreSQL or external databases without that label.
  previewFollowDatabasePrimary: true
  # Canonical platform host for the UI, authentication, and platform API.
  domain: social-vibecoding.example.invalid
  # Empty retains the historical <slug>.<domain> layout.
  appsDomain: ""
  # The app-host gate (scripts/app-gate.js): "on" routes every app and preview
  # Ingress through a platform-owned check (members-only private apps, signing
  # people in at an app's own address, and offline apps' cache headers below);
  # "off" routes them straight to their own Services. "on" needs the app
  # namespace's policy (foundation) to allow pods labelled
  # app.kubernetes.io/name=usernode-app-gate to reach app pods on 3000 and the
  # platform Service, and ingress-controller traffic to the gate (the
  # foundation chart's tenant network policy carries these). "off", plus an
  # Argo sync, is the fallback.
  appGate: "on"
  # "off" stops signing people in at an app's own address (no hop to the
  # platform for a sign-in, no identity added to app requests); the gate
  # itself, and members-only private apps, are unaffected.
  appHostSignin: "on"
  # Project apps that open offline from the browser's own cache
  # (src/services/offline-cache.js). "on" has the app gate give app pages and
  # files a 30-day fresh lifetime and the shell open them offline, and serves
  # the shared /usernode-* files stale-while-revalidate. Needs appGate "on" to
  # reach app pages; "off" is the fallback and needs no deploy of any app.
  appOfflineCache: "on"
  # Optional waitlist OAuth callback origin. Empty uses the application's canonical origin.
  waitlistOauthOrigin: ""
  # Firebase phone authentication flag; enable in the cluster's plaintext values.
  firebasePhoneAuthEnabled: false
  # Projects made inside a platform preview (services/preview-projects.js):
  # production makes each one's database on the preview database server,
  # builds it from the git host and runs it like an app proposal's preview,
  # for that preview only, and retires them with it. On by default, and an
  # admin turns it off or on again in Admin > Limits with no deploy
  # (services/preview-projects-setting.js). false here is the operator's
  # absolute off switch, which the admin setting cannot override. Needs
  # gitHost and the preview database server.
  previewProjects: true
  platformRepository: https://github.com/replace-me/social-vibecoding
  # Homeroom's own git host, where app repositories live
  # (services/git-host.js; docs/plans/github-independence-build.md). Empty
  # url: none, and app repositories stay where their repo_url says. The
  # platform, its builds and its workers read and write through internalUrl
  # (empty: url itself), the in-cluster Service, which the platform reaches
  # through networkPolicy.gitHost; user is the service account whose token
  # is secrets.gitHostToken.
  gitHost:
    url: ""
    internalUrl: ""
    org: apps
    user: ""
    # Non-admin account with repository read access (defaults to user).
    readUser: ""
  nodeRpcUrl: http://replace-me.invalid:3000
  # Explorer host[:port] without a scheme. Public hosts use HTTPS; private
  # numeric addresses use HTTP, matching the platform's existing proxy logic.
  explorerUpstream: testnet-explorer.usernodelabs.org
  explorerUpstreamBase: /api
  explorerUseHttp: false
  # Canonical Rust ChainId for the current testnet. Override this only when
  # deploying a different genesis; the application validates the exact value.
  nativeSessionV2TestnetChainId: "utc1rq8tql3wr5w8u6nvkwepu7dazq89kv2838xwf02xmg2w5vzgly3s6xf63v"
  internalUrl: http://social-vibecoding.social-platform.svc.cluster.local:3000
  # The media store's S3-compatible bucket (screenshots, videos and other
  # files kept out of PostgreSQL), as MEDIA_STORAGE_ENDPOINT and
  # MEDIA_STORAGE_BUCKET. Empty endpoint: off. The key pair is
  # secrets.mediaStorageAccessKey / mediaStorageSecretKey. App file uploads
  # (MINIO_*, src/services/app-files.js) are a separate store and stay off.
  mediaStorage:
    endpoint: ""
    bucket: ""
  logLevel: INFO
  workerMemory: 2g
  # A worker on the platform's own repository (its agent boots the whole
  # platform and a browser): 2g OOM-killed most of its bot builds that died.
  workerMemoryPlatformRepo: 4g
  # Platform signals (src/services/platform-signals.js): every problem the
  # platform detects in itself becomes one request on Homeroom's board.
  # `mode`: shadow keeps the rows the topic pages and figures read and files
  # nothing; file files the requests; off does nothing. `kinds`: a comma list
  # of the kinds allowed to file (empty: every kind), so a noisy one can go
  # back to shadow alone. `bot`: "off" leaves every request to people.
  platformSignals:
    mode: shadow
    kinds: ""
    bot: "on"
    # File only Homeroom security requests while other kinds stay in shadow.
    securityAudit: "on"
  workerCpus: "2"
  captureMemory: 6g
  captureCpus: "8"
  # Proposal checks runs with Jobs on the cluster at once (a capture Job and a
  # unit-suite Job each); further runs wait for a slot after their preview is
  # built. Main-watch's run of main has one slot besides these. 0 turns the
  # queue off. See the chart README.
  checksMaxConcurrentRuns: 4
  # A dedicated node pool for check Jobs, as the pool nodes' label key=value
  # (for example "usernodelabs.org/node-pool=cpu-heavy"). Checks tolerate a
  # NoSchedule taint with the same pair and prefer those nodes, falling back
  # to the others when the pool is full or down. Empty keeps the default
  # spread over every node. See the chart README.
  checkNodePool: ""
  # Require the pool instead of spilling checks onto app-serving nodes. The
  # checks queue waits for a ready pool; configure a valid label pair first.
  checkNodePoolRequired: false
  # Prometheus with kube-state-metrics node labels/readiness/capacity. Empty
  # uses the Kubernetes node API, which requires separate operator-granted RBAC.
  checkPoolMetricsUrl: ""
  # Explicit generated production app ID -> small|standard assignments.
  # Previews, internal runtimes and Homeroom retain the standard profile.
  appResourceProfiles: {}
  # Match application defaults here; each cluster declares its own capacity.
  # The web Pods' pools (the conductor's are platform.conductor's). With the
  # conductor off, the platform Pods do its work and take its wfPoolMax and
  # databaseOperations.
  dbPoolMax: 10
  wfPoolMax: 2
  databaseOperations: 2
  maxGlobalSessions: 25
  maxUserSessions: 3
  maxUserPromotedSessions: 5
  maxAdminUserSessions: 5
  maxAdminUserPromotedSessions: 8
  workerIdleEvictionMs: 600000
  sessionAutopauseIdleMs: 300000
  stagingIdleTeardownMs: 21600000
  # Keep previews and their data, but stop unused app processes after one hour.
  # Active work/checks/visuals remain excluded. Zero disables sleeping.
  previewSleepAfterMs: 3600000
  # Reviewed request-driven production app IDs, empty until a pilot is chosen.
  # Zero afterMs wakes sleeping apps and disables further sleeps.
  appSleepAppIds: []
  appSleepAfterMs: 3600000

secrets:
  create: false
  existingSecret: social-vibecoding
  databasePassword: ""
  # The preview database server's credential (previewPostgresql above).
  previewDatabasePassword: ""
  webDatabasePassword: ""
  conductorDatabasePassword: ""
  migratorDatabasePassword: ""
  provisionerDatabasePassword: ""
  previewReadDatabasePassword: ""
  previewProvisionerDatabasePassword: ""
  adminUsername: ""
  adminPassword: ""
  sessionSecret: ""
  dataEncryptionKey: ""
  iframeJwtPrivateKey: ""
  iframeJwtPublicKey: ""
  workerJwtSecret: ""
  # Alertmanager's bearer token for /api/internal/alerts. Empty turns the
  # route off (503). The same value goes in the infra repo's receiver.
  alertmanagerWebhookToken: ""
  edgeJwtSecret: ""
  topochainPartnerApiKey: ""
  githubAppId: ""
  githubPrivateKey: ""
  # The git host's service account token (config.gitHost). Supply through SOPS.
  gitHostToken: ""
  # Web's separate read:repository token. Use a non-admin account with read-only
  # access to the apps org; provision through SOPS before deploying the split.
  gitHostReadToken: ""
  # Optional signed pull_request webhook; supply through encrypted external values.
  githubWebhookSecret: ""
  # Optional GitHub account-linking OAuth credentials. Set both in encrypted external values.
  githubLinkClientId: ""
  githubLinkClientSecret: ""
  # Optional X account-linking OAuth credentials. Set both in encrypted external values.
  xLinkClientId: ""
  xLinkClientSecret: ""
  # Optional waitlist OAuth credentials. Set each pair in encrypted external values.
  waitlistGithubClientId: ""
  waitlistGithubClientSecret: ""
  waitlistXClientId: ""
  waitlistXClientSecret: ""
  anthropicApiKey: ""
  anthropicAdminKey: ""
  # Optional OpenRouter management credential, supplied through encrypted external values.
  # With the conductor on it is the conductor's alone (its own Secret, see
  # templates/secret.yaml): the web Pods ask it for every managed key.
  openrouterManagementApiKey: ""
  # Optional Gmail sender credentials. Set all three in encrypted external values.
  gmailOauthClientId: ""
  gmailOauthClientSecret: ""
  gmailOauthRefreshToken: ""
  # Optional engagement tracking with the existing sender. Supply through SOPS.
  platformMailTrackingSecret: ""
  # Which transport sends platform mail until an admin saves a provider in
  # Admin → Email delivery, which wins. Empty leaves it on auto (Gmail first).
  # Brevo sends only when named, here or there: brevoApiKey does not move mail.
  platformMailProvider: ""
  # Bearer token Brevo's mail webhook sends. Supply through SOPS; empty leaves
  # POST /api/mail/webhooks/brevo answering 404.
  brevoMailWebhookToken: ""
  # The media store's key pair for config.mediaStorage. Supply both through SOPS.
  mediaStorageAccessKey: ""
  mediaStorageSecretKey: ""
  # Optional mobile push settings. Supply all four through encrypted external values.
  mobilePushEnabled: false
  pushEnv: ""
  firebaseProjectId: ""
  firebaseServiceAccountJsonB64: ""
  # Optional Firebase web API key, supplied through encrypted external values.
  firebaseWebApiKey: ""
  # Optional Brevo SMS credentials and country-to-Sender-ID JSON registry.
  # Supply through SOPS; an empty key and registry leave Brevo unavailable.
  brevoApiKey: ""
  brevoSmsSenderIds: "{}"
  # Optional Twilio SMS credentials, its own country-to-Sender-ID JSON
  # registry and the public webhook URL. Supply through SOPS; an empty
  # account, token and registry leave Twilio unavailable.
  twilioAccountSid: ""
  twilioAuthToken: ""
  twilioSmsSenderIds: "{}"
  twilioStatusCallbackUrl: ""

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-public
    ingress.cilium.io/loadbalancer-mode: shared
  tls:
    enabled: true
    secretName: social-vibecoding-tls

networkPolicy:
  checkPoolMetricsNamespace: monitoring
  enabled: true
  ciliumApiServerEgress: true
  # Must match APP_NAMESPACE in the foundation's social-build-policy ConfigMap.
  appNamespace: social-apps
  # Optional cross-namespace access to the selected UserNode HTTP endpoint.
  # Keep the Pod selector specific so the platform cannot reach every workload
  # in the network namespace merely because it needs one node's /status API.
  nodeRpc:
    enabled: false
    namespace: ""
    port: 3000
    podSelector: {}
  explorer:
    enabled: false
    namespace: ""
    port: 3080
    podSelector: {}
  # The git host's in-cluster Service (config.gitHost.internalUrl), which
  # the HTTPS-to-the-internet rule does not cover.
  gitHost:
    enabled: false
    namespace: social-git
    port: 3000
    podSelector:
      app.kubernetes.io/name: forgejo
  # Generated apps and workers call authenticated internal platform APIs.
  internalCallerNamespaces:
    - social-apps
    - social-workers
    # Alertmanager's `homeroom` receiver posts infra alerts to
    # /api/internal/alerts (src/routes/alerts-webhook.js), which checks its
    # token.
    - monitoring
  # Generated applications connect directly to their dedicated PostgreSQL
  # databases using per-database roles. Workers do not require database access.
  databaseCallerNamespaces:
    - social-apps

# The workflow's metrics and alerts (docs/kubernetes-operations.md,
# "Workflow alerts"): a PodMonitor for the conductor's metrics port and a
# PrometheusRule, picked up by the cluster's kube-prometheus-stack, whose
# Alertmanager routes them.
monitoring:
  enabled: true
  # The `release` label the Prometheus Operator selects monitors and rules by.
  prometheusRelease: kube-prometheus-stack
  # The namespace Prometheus scrapes from (admitted on the metrics port).
  namespace: monitoring
podDisruptionBudget:
  enabled: true
