<style>
/* Layout: one 1120px column. A ledger of findings ranked by severity, each row a stripe + title + first screenshot; detail opens in place. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --sunk: #eceef2; --ink: #15171c; --muted: #5a6170; --line: #dfe2e8;
  --accent: #1463d6; --accent-tint: #e6effd;
  --high: #c0262d; --high-tint: #fdeced; --med: #a85d00; --med-tint: #fdf2e2; --low: #56657c; --low-tint: #edf0f5;
  --ok: #1d7a46;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1014; --surface: #171a20; --sunk: #1d2129; --ink: #e8ebf0; --muted: #9ba3b3; --line: #2a2f39;
  --accent: #6ea6ff; --accent-tint: #1b2a44;
  --high: #ff7a7f; --high-tint: #3a1d20; --med: #f2b55e; --med-tint: #382a17; --low: #9fb0c8; --low-tint: #222a36;
  --ok: #5fd08f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #171a20; --sunk: #1d2129; --ink: #e8ebf0; --muted: #9ba3b3; --line: #2a2f39;
  --accent: #6ea6ff; --accent-tint: #1b2a44;
  --high: #ff7a7f; --high-tint: #3a1d20; --med: #f2b55e; --med-tint: #382a17; --low: #9fb0c8; --low-tint: #222a36;
  --ok: #5fd08f; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

header.top { display: grid; gap: 14px; margin-bottom: 28px; }
.lede { max-width: 68ch; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 120px; }
.stat b { display: block; font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat.high b { color: var(--high); } .stat.medium b { color: var(--med); } .stat.low b { color: var(--low); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--sunk); max-width: 520px; }
.bar span { display: block; height: 100%; }

nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 26px; }
nav.toc a { text-decoration: none; padding: 6px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 500; font-size: 14px; }

section { margin-top: 40px; display: grid; gap: 14px; }
.start { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; min-width: 0; }
.card .shot { aspect-ratio: 16/10; width: 100%; max-width: 100%; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--sunk); }

.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters select, .filters input[type=search] { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 14px; min-width: 0; }
.filters input[type=search] { flex: 1 1 180px; }
.count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; border-left: 5px solid var(--low); min-width: 0; }
.item.high { border-left-color: var(--high); } .item.medium { border-left-color: var(--med); }
.item.done { opacity: 0.55; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 14px; cursor: pointer; align-items: start; }
.row .thumb { width: 96px; height: 64px; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid var(--line); background: var(--sunk); }
.titleline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; min-width: 0; }
.titleline h3 { font-family: var(--body); font-weight: 600; font-size: 15.5px; flex: 1 1 360px; min-width: 0; }
.id { font: 500 12px/1 var(--mono); color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.sev { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
.tag.sev.high { background: var(--high-tint); color: var(--high); } .tag.sev.medium { background: var(--med-tint); color: var(--med); } .tag.sev.low { background: var(--low-tint); color: var(--low); }
.tag.area { background: var(--accent-tint); color: var(--accent); }
.tag.ver { background: transparent; border: 1px solid var(--line); }
.detail { padding: 0 14px 14px; display: grid; gap: 12px; }
.detail dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; margin: 0; }
.detail dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
.detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.shots { display: flex; flex-wrap: wrap; gap: 10px; }
.shots figure { margin: 0; width: 220px; max-width: 100%; }
.shots img { width: 100%; height: 300px; object-fit: contain; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; cursor: zoom-in; }
.shots figcaption { font: 500 11px/1.3 var(--mono); color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.donebox { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }

.journeys { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.journey ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.journey li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; font-size: 14px; }
.journey time { font: 500 12px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.journey li.bad span { color: var(--high); }
.verdict { font-size: 13px; font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--high); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); background: var(--sunk); }
td.c { text-align: center; }
td.y { color: var(--ok); } td.n { color: var(--muted); }
.notes { display: grid; gap: 10px; max-width: 78ch; }
.notes li { margin-bottom: 6px; }

#lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 14, 0.88); display: grid; grid-template-rows: 1fr auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
#lightbox img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; border-radius: 6px; min-height: 0; }
#lightbox .bar2 { display: flex; gap: 10px; align-items: center; justify-content: center; color: #e8ebf0; font: 500 13px var(--mono); padding-top: 10px; }
#lightbox button { background: #2a2f39; border: 0; color: #e8ebf0; border-radius: 99px; padding: 6px 14px; cursor: pointer; }
@media (max-width: 560px) {
  .filters { position: static; }
  .row { grid-template-columns: 1fr; }
  .row .thumb { display: none; }
  .detail dl { grid-template-columns: 1fr; }
  .shots figure { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .item { transition: opacity .15s; } }
</style>

ources": ["F028"], "shots": [{"src": "../fixes/shots/B04-1.jpg", "label": "14-a-group"}, {"src": "../fixes/shots/B04-2.jpg", "label": "08-thread-50s"}]}, {"id": "B05", "title": "'Change something' on a plan says the group will see it, then the bot only drafts it privately", "sev": "high", "area": "Homeroom bot", "devices": ["phone app", "all"], "summary": "After sending the change, the person must open a thread and press 'Post it' before the bot re-plans; meanwhile Build it still offers the old plan.", "repro": "Plan card > Change something > type 'Also show who has each thing…' > Send. Composer says 'What you write is posted on the request, where the group can see it.' Bot replies 'I drafted that to post on Neighbourhood Swap, in a thread only you can see. Nothing is posted until you post it.' You must open '1 update in its thread' and press 'Post it'. Meanwhile the plan card still offers Build it on the old plan.", "cause": "the change-plan reply is routed through the generic DM 'draft a post' path instead of the plan-revision path", "verified": true, "sources": ["F018"], "shots": [{"src": "../fixes/shots/B05-1.jpg", "label": "05-typed"}, {"src": "../fixes/shots/B05-2.jpg", "label": "06-sent"}, {"src": "../fixes/shots/B05-3.jpg", "label": "08-draft-thread"}, {"src": "../fixes/shots/B05-4.jpg", "label": "09-posted"}]}, {"id": "B06", "title": "'Build it' on a Needs you row doesn't build: it opens a thread that has no Build it button and says 'Waiting for @you'", "sev": "high", "area": "Homeroom bot", "devices": ["desktop 1440", "all"], "summary": "The real Build it is on the plan card back in Main Chat; the thread talks about the requester in the third person.", "repro": "Bot tab > Needs you > tap 'Build it' on the request row. The request thread opens; it says 'Waiting for @audit_ada to OK the plan' with only 'See progress' and 'Read'. The real Build it is on the plan card back in Main Chat.", "cause": "row's action label promises the action but routes to the thread; thread's waiting card has no approve control", "verified": true, "sources": ["F006", "F007"], "shots": [{"src": "../fixes/shots/B06-1.jpg", "label": "desktop-after-build-it"}, {"src": "../fixes/shots/B06-2.jpg", "label": "desktop-plan-card-bottom"}]}, {"id": "V01", "title": "A vote waiting on you shows in Communities and Workshop, but the Hub says 'Nothing more to vote on' and Needs you says 'All caught up'", "sev": "high", "area": "Votes", "devices": ["all", "desktop-800", "desktop-1024", "desktop", "desktop-1440", "desktop-1920"], "summary": "Other screens agree the user owes a vote: Communities shows '1 vote waiting on you · Book Club', the bot's NEEDS YOU lists Book Club with a Vote link, and the request page shows 'Needs 2 more yes' with a Vote button. The project's own Hub says 'Nothing more to vote on.' The Hub is the project's front door, and here it hides the one decision the user owes.", "repro": "Book Club (group) with the bot's change up for a vote, as audit_ada who has not voted: Communities tab 'Communities, 1 vote waiting on you' and row '1 to vote'; Workshop '1 waiting on a vote'; Hub For you 'Nothing more to vote on.'; Needs you 'All caught up. Every change you can vote on has your answer.'", "cause": "Hub/Needs-you vote query excludes this change (probably the bot's change whose screenshots failed, or the requester's own) while the counts include it", "verified": true, "sources": ["F034", "D1", "P15", "A1"], "shots": [{"src": "../fixes/shots/V01-1.jpg", "label": "needs-you-click"}, {"src": "../fixes/shots/V01-2.jpg", "label": "desktop--workshop"}, {"src": "../fixes/shots/V01-3.jpg", "label": "desktop--communities"}, {"src": "../fixes/shots/V01-4.jpg", "label": "verify-3"}]}, {"id": "K01", "title": "Replying on a request page with the keyboard up: the reply box sits behind the keys and the thread shrinks to one sliced line", "sev": "high", "area": "Keyboard", "devices": ["Android emulator, Chrome (real)", "iPhone Safari", "Android Chrome", "phone sideways"], "summary": "When Reply is focused, the request card shrinks to its title. The thread is one sliced line: '(#1) · 9:15 PM' cut through the glyphs on iPhone, and a half-avatar plus clipped name on Android. In landscape only the Workshop pill and the Reply box remain. On Android and in landscape the jump-to-latest chevron also covers the title ('vote on the n[v]one'). You cannot see what you are replying to, and the large title block stays on screen while the content goes.", "repro": "Open a request (dev/issues/1), tap the reply box with the keyboard up on a short viewport", "cause": "request page's composer is not lifted by the keyboard inset like chats (layout rule reply-box-covered, 10px and 36px behind)", "verified": true, "sources": ["F015", "P4"], "shots": [{"src": "../fixes/shots/K01-1.jpg", "label": "11-request-keyboard"}, {"src": "../fixes/shots/K01-2.jpg", "label": "safari-phone--request--keyboard"}, {"src": "../fixes/shots/K01-3.jpg", "label": "phone-sideways--request--keyboard"}, {"src": "../fixes/shots/K01-4.jpg", "label": "android-chrome--request--keyboard"}]}, {"id": "L01", "title": "Phone held sideways: the side rail's 'Home' row is printed over the page title", "sev": "high", "area": "Phone sideways", "devices": ["iPhone Safari sideways 852x393", "phone-sideways"], "summary": "On Communities, Homeroom bot, Messages, DM, group, the App tabs and the request page, the rail's first row (house icon and 'Home') sits on top of the header's sidebar toggle and page title. You get 'Home' overprinted on 'Communities' / 'Messages' / 'Homeroom bot', and on the hub-open shot the title 'Neighbourhood Swap' runs half-faded under the rail and half-bold beside it. On the request page a pale green band covers the rail's top. It looks broken and covers both the sidebar toggle and the page title. Home, Discover, Profile, Settings and the hub do not overlap, so this is position or stacking on some screens only.", "repro": "Turn an iPhone sideways in Safari: Communities, Homeroom bot, Messages: 'Home' and its icon overprint 'Communities' / 'Homeroom bot' / 'Messages' at the top-left", "cause": "page title in the header row and the rail's first row share the same box when the rail is shown at <500px height", "verified": true, "sources": ["F035", "P1"], "shots": [{"src": "../fixes/shots/L01-1.jpg", "label": "phone-sideways--communities"}, {"src": "../fixes/shots/L01-2.jpg", "label": "phone-sideways--homeroom-bot"}, {"src": "../fixes/shots/L01-3.jpg", "label": "verify-2"}, {"src": "../fixes/shots/L01-4.jpg", "label": "phone-sideways--direct-message--keyboard"}]}, {"id": "B07", "title": "One new-project message gets two bot replies at once, each quoting the whole question", "sev": "medium", "area": "Homeroom bot", "devices": ["desktop 1440", "all"], "summary": "", "repro": "Main Chat: 'Can you make us a chore chart for our flat? …' > Send. Reply 1: 'New thread, for a new project: … Only you can see it.' Reply 2: 'That sounds like a new app of its own, so I'll come back to you here in a minute…'. Needs you also lists it under 'Only you' with 'Only you' again on the right.", "cause": "the new-thread notice and the conversational reply are posted as two messages; reply-to quote on both", "verified": true, "sources": ["F024"], "shots": [{"src": "../fixes/shots/B07-1.jpg", "label": "04-after-25s"}]}, {"id": "B08", "title": "A new-project thread renames itself to the person's latest reply ('Yes please. Just the three of us…')", "sev": "medium", "area": "Homeroom bot", "devices": ["desktop 1440"], "summary": "", "repro": "Reply 'Yes please…' in a 'New thread, for a new project: A chore chart…' thread: its title and row become the reply text", "cause": "thread title derived from the latest user message instead of the idea/project name", "verified": true, "sources": ["F026"], "shots": [{"src": "../fixes/shots/B08-1.jpg", "label": "bot-ben-3"}]}, {"id": "B09", "title": "Bot plan and 'live' messages lose their cards ('Cards refused') and arrive as bare text", "sev": "medium", "area": "Homeroom bot", "devices": ["server, all"], "summary": "", "repro": "Seen 4 times in one evening on private projects (Watering Rota plan + live, Book Club live, a hello for Cy). Server log: homeroom-bot-dm 'Cards refused; sending the message without them'.", "cause": "conversations.sendMessage validates each card with sharedObjects.validateForShare as the bot user; it likely cannot see private projects, so the whole card list is refused and the DM falls back to text", "verified": true, "sources": ["F044"], "shots": [{"src": "../fixes/shots/B09-1.jpg", "label": "desktop-live"}]}, {"id": "B10", "title": "The bot plans 'fake demo people', and Try it shows them as 'staging-demo-priya' under a 'Staging demo' line", "sev": "medium", "area": "Homeroom bot", "devices": ["phone app", "all"], "summary": "", "repro": "Cy's Swap change ready > Try it: 'Things to borrow · Staging demo: made-up things and neighbours, for looking around.' Rows 'Belongs to staging-demo-priya / With staging-demo-sam'. The plan's 5th bullet was 'Fake demo people so the week looks filled'.", "cause": "the spec asks for seeded demo data in staging and the builder names it with internal prefixes; voters see internal words and fake people mixed with their own items", "verified": true, "sources": ["F049", "F003"], "shots": [{"src": "../fixes/shots/B10-1.jpg", "label": "02-try-it-5s"}, {"src": "../fixes/shots/B10-2.jpg", "label": "desktop-ai"}, {"src": "../fixes/shots/B10-3.jpg", "label": "tryit-cy"}, {"src": "../fixes/shots/B10-4.jpg", "label": "01-ready-card"}]}, {"id": "B11", "title": "Floating '3 new messages' pill and jump-to-latest chevron sit on top of message and plan text", "sev": "medium", "area": "Homeroom bot", "devices": ["desktop 1440", "android-chrome", "phone-sideways", "android-small", "duo-sideways", "phone 393 (app)"], "summary": "The round down-chevron is placed over body text: 'top with the[v]tup date' on Android, and over the bold 'Let members su[v]gest a book' in landscape. It hides words in the one message on screen. Pin it beside the composer or into the gutter, not over content.", "repro": "Bot tab, plan card partly below the fold: the round chevron overlaps 'Your days are still there…' / 'Fake demo people…'", "cause": "floating button over content, no scroll-padding for it", "verified": true, "sources": ["F002", "F001", "P7", "A8", "I18", "X14"], "shots": [{"src": "../fixes/shots/B10-2.jpg", "label": "desktop-ai"}, {"src": "../fixes/shots/B11-2.jpg", "label": "iphone-mini--request"}, {"src": "../fixes/shots/B11-3.jpg", "label": "02-main-chat"}, {"src": "../fixes/shots/B11-4.jpg", "label": "android-chrome--request"}]}, {"id": "B12", "title": "Thread status rows break open the bot's chat bubbles (a bubble with no top edge, borders running into rows)", "sev": "medium", "area": "Homeroom bot", "devices": ["desktop 1440", "desktop-800", "desktop-1024", "desktop", "desktop-1440", "desktop-1920"], "summary": "The 9:24 bubble has no bottom edge and the 9:28 bubble has no top edge. The 'B ▷ #1 Let members suggest... Ready for your yes · 4 updates' row sits across the gap, so the two messages look like one broken frame with a row painted over it. This looks like a rendering glitch at every width.", "repro": "Main Chat after Build it: the 9:12 bubble's left/right borders start under '1 update in its thread' with no top border", "cause": "grouped-message continuation style applied to a bubble that follows a thread link", "verified": true, "sources": ["F014", "D3", "A22"], "shots": [{"src": "../fixes/shots/B12-1.jpg", "label": "desktop-ready-card"}, {"src": "../fixes/shots/B12-2.jpg", "label": "desktop-1920--homeroom-bot"}, {"src": "../fixes/shots/B12-3.jpg", "label": "desktop-1440--homeroom-bot"}, {"src": "../fixes/shots/B12-4.jpg", "label": "desktop-1024--homeroom-bot"}]}, {"id": "B13", "title": "The bot tab squeezes three columns on in-between widths: its header breaks one word per line on a sideways phone and at 800px", "sev": "medium", "area": "Homeroom bot", "devices": ["iPhone Safari sideways", "phone-sideways", "desktop-800", "duo-sideways", "ipad", "ipad-sideways"], "summary": "The list column is about 170 pt wide. 'Homeroom bot' wraps onto two lines and 'Homeroom' is cut off at the card's right edge. 'Needs you: 1 · In progress: 0' breaks one word per line down the card. The project chip shows only 'Book C' and the Main Chat row is pushed below the fold. The rail, list and chat each get a third of 852 pt, and the list's third cannot hold its own header.", "repro": "Homeroom bot on a phone held sideways: 'Homeroom bot / Needs / you: / 1 · / In / progress: / 0'", "cause": "rail (~270pt) + list + chat all shown at 852pt width", "verified": true, "sources": ["F036", "P2", "D4", "I26"], "shots": [{"src": "../fixes/shots/L01-2.jpg", "label": "phone-sideways--homeroom-bot"}, {"src": "../fixes/shots/B13-2.jpg", "label": "phone-sideways--homeroom-bot"}, {"src": "../fixes/shots/B13-3.jpg", "label": "phone-sideways--homeroom-bot--keyboard"}, {"src": "../fixes/shots/B13-4.jpg", "label": "desktop-800--homeroom-bot"}]}, {"id": "B14", "title": "Android app: the bot tab's 'Ask Homeroom bot' bar sits under the system navigation bar", "sev": "medium", "area": "Homeroom bot", "devices": ["Android small phone, app (emulated insets)"], "summary": "", "repro": "Android app shape 360x640 with a 48px navigation bar: Homeroom bot tab, ask bar text and mic under the nav bar (layout rule content-under-system)", "cause": "ask bar positioned from the viewport bottom without the bottom inset the tab bar uses; verify on a real Android build", "verified": true, "sources": ["F032"], "shots": [{"src": "../fixes/shots/B14-1.jpg", "label": "android-small--homeroom-bot"}]}, {"id": "B15", "title": "A triage fails ('no warm worker registered for session 6') when several requests arrive together", "sev": "medium", "area": "Homeroom bot", "devices": ["server"], "summary": "", "repro": "File 4 requests on 2 projects within a few seconds; one triage fails on the platform", "cause": "warm-worker registration races with concurrent bot sessions (seen on the Docker runtime)", "verified": true, "sources": ["F011"], "shots": []}, {"id": "S01", "title": "Restarting the app on 'Your new community · Share invite' drops a newcomer on Home; the invite step and their first look are gone", "sev": "medium", "area": "First session", "devices": ["phone app"], "summary": "", "repro": "New account: pick Tier list > Make it > (Ready to use, Share invite / Invite people later) > reload or relaunch the app", "cause": "the first-session hand-off is page state, not persisted; a cold start routes a settled account to #home", "verified": true, "sources": ["F021"], "shots": [{"src": "../fixes/shots/S01-1.jpg", "label": "08-reload"}, {"src": "../fixes/shots/S01-2.jpg", "label": "03-after-make-1s"}, {"src": "../fixes/shots/S01-3.jpg", "label": "04-after-make-5s"}, {"src": "../fixes/shots/S01-4.jpg", "label": "new-user-make"}]}, {"id": "V02", "title": "After voting on the only change waiting, the Communities badge grows from a blue 1 to a grey 2", "sev": "medium", "area": "Votes", "devices": ["phone app"], "summary": "", "repro": "As Cy: Communities > Review > Vote yes. 'All caught up', but the tab badge now reads 2 (grey) instead of clearing", "cause": "badge switches from votes (blue) to unread messages (grey) with no cue that it changed meaning", "verified": true, "sources": ["F042"], "shots": [{"src": "../fixes/shots/V02-1.jpg", "label": "05-after-vote"}, {"src": "../fixes/shots/V02-2.jpg", "label": "04-vote-sheet"}, {"src": "../fixes/shots/V02-3.jpg", "label": "vote-cy-2"}]}, {"id": "V03", "title": "The same vote shows three ways in four colours of pill on a request, with zero counts", "sev": "medium", "area": "Votes", "devices": ["desktop-800", "desktop-1024", "desktop", "desktop-1440", "desktop-1920", "android-small"], "summary": "The Votes card shows 'Needs 2 more yes' and a blue Vote button. At 1920 the change header adds a purple 'Vote · 0/2' pill. The bot's message then adds four outlined chips in purple, blue, green and red: '0 of 2 yes votes', 'Preview', 'Yes (0)' and 'No (0)'. These show zero counts, use colours outside the single-accent palette and put four pills in one row.", "repro": "Request page: Votes card, change header and the bot message's chips", "cause": "", "verified": false, "sources": ["D22", "A9"], "shots": [{"src": "../fixes/shots/V03-1.jpg", "label": "desktop-1920--request"}, {"src": "../fixes/shots/V03-2.jpg", "label": "desktop--request"}, {"src": "../fixes/shots/V03-3.jpg", "label": "desktop-800--request"}, {"src": "../fixes/shots/V03-4.jpg", "label": "android-tablet--request"}]}, {"id": "N01", "title": "Phone tab bar: keyboard and screen-reader order (Home, Messages, Bot, Communities) differs from the order on screen", "sev": "medium", "area": "Navigation", "devices": ["all phones, app and browser"], "summary": "", "repro": "DOM/tab/VoiceOver order: Home, Messages, Homeroom bot, Communities, You. On screen: Home, Communities, Homeroom bot, Messages, You.", "cause": "tabs reordered with CSS order (or absolute x) instead of in the DOM; keyboard and screen-reader order no longer match", "verified": true, "sources": ["F016"], "shots": [{"src": "../fixes/shots/N01-1.jpg", "label": "tabbar"}]}, {"id": "N02", "title": "The Communities tab becomes the last community's boxed tile ('B'), keeps it in other projects, and its label sits lower than its neighbours", "sev": "medium", "area": "Navigation", "devices": ["iPhone Duo folded, real app", "all phones", "all phones, app and browser", "duo-folded", "android-small", "safari-phone"], "summary": "After you visit Book Club, the Communities item becomes a teal-framed 'B' with a grey badge. It stays that way on Profile, Settings and Challenges, and even inside Watering Rota's app. The tab then looks like a Book Club shortcut, and its badge loses the blue that marks a waiting vote.", "repro": "Open Book Club, then Watering Rota: the rail/tab 'Communities' shows a boxed 'B' with a grey badge while you are in Watering Rota; on Home it is the boxed people glyph", "cause": "tab icon switches to a 'last community' tile; reads as if Book Club were selected; also the source of the boxed-icon misalignment (F017)", "verified": true, "sources": ["F046", "F017", "A31", "A34", "P13", "I11"], "shots": [{"src": "../fixes/shots/N01-1.jpg", "label": "tabbar"}, {"src": "../fixes/shots/N02-2.jpg", "label": "duo-capsule-crop"}, {"src": "../fixes/shots/N02-3.jpg", "label": "safari-phone--home"}, {"src": "../fixes/shots/N02-4.jpg", "label": "verify-duo"}]}, {"id": "N03", "title": "A link to a project's Workshop or Proposals lands on the Hub (clicking Workshop inside the app works)", "sev": "medium", "area": "Navigation", "devices": ["all", "desktop-800", "desktop-1024", "desktop", "desktop-1440", "desktop-1920"], "summary": "At every width, the Workshop shots and the Proposals shots both show Book Club's Hub, with 'Hub' highlighted in the sidebar, and the two are identical. The Workshop board and the proposals list never appear. Either those routes redirect to the Hub or they cannot be reached directly. Worth checking which.", "repro": "Load /app/book-club-d10610/workshop or #app/…/dev/proposals cold: the Hub shows with Hub lit in the sidebar. Clicking Workshop in the sidebar then shows the Workshop.", "cause": "_landOnHub runs for any cold entry to a project, not only for doors that say 'hub'", "verified": true, "sources": ["F040", "D15", "P9", "A2", "I24", "X10"], "shots": [{"src": "../fixes/shots/V01-2.jpg", "label": "desktop--workshop"}, {"src": "../fixes/shots/N03-2.jpg", "label": "desktop--proposals"}, {"src": "../fixes/shots/N03-3.jpg", "label": "desktop-1920--workshop"}, {"src": "../fixes/shots/N03-4.jpg", "label": "desktop-1920--proposals"}]}, {"id": "N04", "title": "Sidebar badges change colour and shape or vanish between pages, and an unexplained grey dot sits on a project's App row", "sev": "medium", "area": "Navigation", "devices": ["desktop-800", "desktop-1024", "desktop", "desktop-1440", "desktop-1920", "android-tablet"], "summary": "Book Club's blue '1' disappears when its row expands, and its 'Needs you' sub-row shows no count. 'All 4 communities' shows a blue '1' on most pages but a grey one on the Hub. Homeroom bot shows a grey '1' circle at 800. #general has a grey '2 unread' pill, while the Hub shows the same messages as a blue '2 new' pill. One kind of count gets four different treatments, and the one that matters disappears when you open the project.", "repro": "Left sidebar, Communities list", "cause": "", "verified": true, "sources": ["D13", "A28", "P32", "D14", "I12", "I34"], "shots": [{"src": "../fixes/shots/V01-2.jpg", "label": "desktop--workshop"}, {"src": "../fixes/shots/N04-2.jpg", "label": "desktop--hub-group"}, {"src": "../fixes/shots/N04-3.jpg", "label": "desktop--home"}, {"src": "../fixes/shots/N04-4.jpg", "label": "desktop-800--home"}]}, {"id": "N05", "title": "Request page: two back buttons, and its header says 'Hub' under a '< Workshop' breadcrumb", "sev": "low", "area": "Navigation", "devices": ["android-small", "android-tablet", "duo-folded", "safari-phone", "android-chrome", "phone"], "summary": "The breadcrumb right under the header reads '< Workshop', so the two disagree about where you are. On the tablet, none of App, Hub, Needs you or Workshop is lit while a request is open, so nothing shows where you are.", "repro": "Header subtitle under 'Book Club'; tablet sidebar project sub-list", "cause": "", "verified": true, "sources": ["A3", "P17", "I16"], "shots": [{"src": "../fixes/shots/N05-1.jpg", "label": "10-request"}, {"src": "../fixes/shots/N05-2.jpg", "label": "android-small--request"}, {"src": "../fixes/shots/N05-3.jpg", "label": "duo-folded--request"}, {"src": "../fixes/shots/V03-4.jpg", "label": "android-tablet--request"}]}, {"id": "L02", "title": "Phone sideways: the side rail takes about a third of the width and squeezes every page", "sev": "medium", "area": "Phone sideways", "devices": ["phone-sideways"], "summary": "On a phone held sideways the full-width rail stays open by default. Settings then has three columns, so the list truncates 'Linked ph...'. The Communities row subtitle cuts off at '1 in progress · 2 new messages · 3 ...'. The hub subtitle wraps 'Private community · 3 / members' beside its buttons. Home shows only four app tiles above the fold. A collapsed icon rail would give the content the room it needs.", "repro": "Left rail, about 270 of 852 pt", "cause": "", "verified": false, "sources": ["P14"], "shots": [{"src": "../fixes/shots/L02-1.jpg", "label": "phone-sideways--settings"}, {"src": "../fixes/shots/L02-2.jpg", "label": "phone-sideways--communities"}, {"src": "../fixes/shots/L02-3.jpg", "label": "phone-sideways--workshop"}, {"src": "../fixes/shots/L02-4.jpg", "label": "phone-sideways--home"}]}, {"id": "L03", "title": "Typing on a short screen leaves no conversation visible: a sideways phone shows only the reply box; a small Android phone shows only a '2 finished' strip", "sev": "medium", "area": "Keyboard", "devices": ["iPhone Safari sideways", "phone-sideways", "Android emulator, Chrome (real)"], "summary": "In a sideways DM or group, focusing the message box removes the conversation header and every message. Only the outlined composer is left at the top of an empty card. The Homeroom bot chat keeps only the clipped bottom of the last card. Meanwhile the 270 pt rail and the full app header stay visible, so the space goes to navigation instead of the conversation you are typing into.", "repro": "DM on a sideways phone, tap the reply box", "cause": "banner + header + keyboard leave ~0 height for the transcript (header folding from PR 6094 is not enough with the banner)", "verified": true, "sources": ["F041", "P5", "F053"], "shots": [{"src": "../fixes/shots/L03-1.jpg", "label": "06-bot-main-keyboard"}, {"src": "../fixes/shots/L01-4.jpg", "label": "phone-sideways--direct-message--keyboard"}, {"src": "../fixes/shots/L03-3.jpg", "label": "phone-sideways--direct-message--keyboard"}, {"src": "../fixes/shots/L03-4.jpg", "label": "phone-sideways--group--keyboard"}]}, {"id": "L04", "title": "Safari's 'Add it to your home screen' banner stays up on a sideways phone, taking about 70 of 393pt", "sev": "medium", "area": "Install banner", "devices": ["iPhone Safari sideways"], "summary": "", "repro": "Open Homeroom in Safari, turn sideways: banner remains on every screen", "cause": "banner not hidden or compacted on short viewports", "verified": true, "sources": ["F039"], "shots": [{"src": "../fixes/shots/L04-1.jpg", "label": "phone-sideways--discover"}]}, {"id": "L05", "title": "Names break mid-word: 'Neighbourh / ood Swap' under Home's tiles, 'Grou / p…' and 'Sign- / up…' on Discover cards", "sev": "medium", "area": "Text", "devices": ["phones (app and browser)", "phone sideways", "phone-sideways", "safari-phone", "android-chrome", "android-small"], "summary": "Each card fits an icon, the title and a filled Join pill into about 220 pt. The titles come out as 'Grou / p...' and 'Sign- / up...', and the subtitle as 'Upda...'. You cannot tell what the apps are, and the Join button is the widest thing on the card. Use one column here, or put Join under the title.", "repro": "Home > My apps with 'Neighbourhood Swap'; Discover on a sideways phone", "cause": "word-break: break-all / overflow-wrap:anywhere on tile labels; card title column too narrow beside the Join button", "verified": true, "sources": ["F037", "P3", "P10", "A15", "I6"], "shots": [{"src": "../fixes/shots/L05-1.jpg", "label": "iphone-mini--home"}, {"src": "../fixes/shots/L04-1.jpg", "label": "phone-sideways--discover"}, {"src": "../fixes/shots/L05-3.jpg", "label": "after-signin-s"}, {"src": "../fixes/shots/N02-3.jpg", "label": "safari-phone--home"}]}, {"id": "C01", "title": "In a group chat on a phone, the members and ••• button  "D6"], "shots": [{"src": "../fixes/shots/W02-1.jpg", "label": "desktop-1920--home"}, {"src": "../fixes/shots/W02-2.jpg", "label": "desktop-1920--communities"}, {"src": "../fixes/shots/W02-3.jpg", "label": "desktop-1920--discover"}, {"src": "../fixes/shots/W02-4.jpg", "label": "desktop-1920--leaderboard"}]}, {"id": "W03", "title": "Discover at 800px: the two-column grid cuts off every card's subtitle", "sev": "medium", "area": "Desktop layout", "devices": ["desktop-800", "ipad", "duo-sideways"], "summary": "Each card is about 250px wide. Titles wrap onto two lines ('Group / challenge', 'Find a / time'), every subtitle cuts off as 'Updated 2...', and the Homeroom card's description shows only 'The commu...'. The same cards fit on one line at 1024. A single column would fit at this width.", "repro": "Discover, ALL APPS grid", "cause": "", "verified": false, "sources": ["D5", "I8"], "shots": [{"src": "../fixes/shots/W03-1.jpg", "label": "desktop-800--discover"}, {"src": "../fixes/shots/W03-2.jpg", "label": "ipad--discover"}, {"src": "../fixes/shots/W03-3.jpg", "label": "duo-sideways--discover"}, {"src": "../fixes/shots/W03-4.jpg", "label": "ipad-sideways--discover"}]}, {"id": "W04", "title": "Tablet Home and Discover don't use the wide screen; Discover rows are very tall with a filled Join on every row", "sev": "medium", "area": "Tablet layout", "devices": ["android-tablet", "android-small", "duo-folded"], "summary": "Four small app icons are spread about 250px apart across the full width. The Home search bar touches the header with no gap. On Discover, the search box and For you/Browse/Joined stop at about 575px while the card grid below runs about 1000px, and the ALL APPS label is indented about 16px from the cards.", "repro": "Home My apps row and search bar; Discover search, tabs and grid", "cause": "", "verified": false, "sources": ["A21", "A25"], "shots": [{"src": "../fixes/shots/W04-1.jpg", "label": "android-tablet--home"}, {"src": "../fixes/shots/W04-2.jpg", "l it)", "duo-folded"], "summary": "'Communities' is wider than its lit pill and runs past both edges, and 'Messages' touches them. App chips truncate ('Neighbou…', 'Watering …'), and 'Homeroom bot' wraps to two lines while the others use one. The × that removes a recent app is about an 8pt target perched on the icon's corner.", "repro": "Folded Duo app, side rail with a recently opened project: its ✕ 'Forget Watering Rota' is 20x20", "cause": "platform-side-app-x sized for a pointer", "verified": true, "sources": ["F033", "A32", "A33"], "shots": [{"src": "../fixes/shots/U02-1.jpg", "label": "duo-folded--settings"}, {"src": "../fixes/shots/U02-2.jpg", "label": "duo-folded--communities"}, {"src": "../fixes/shots/U02-3.jpg", "label": "duo-folded--hub-open"}, {"src": "../fixes/shots/U01-2.jpg", "label": "duo-folded--workshop"}]}, {"id": "B25", "title": "Duo held sideways: the bot's chat runs under the 84pt system column; Send and the 'Live ›' chevron sit under the clock strip", "sev": "high", "area": "Homeroom bot", "devices": ["duo-sideways"], "summary": "Every other screen stops short of the column. A PR for exactly this (6086, 'chat under the column') was open earlier on 1 November; check it against current main before fixing again.", "repro": "Homeroom bot tab, right chat pane: Send button, 'Live >' chevron, 'New' divider label, row chevrons", "cause": "", "verified": true, "sources": ["I0"], "shots": [{"src": "../fixes/shots/B25-1.jpg", "label": "duo-sideways--homeroom-bot"}, {"src": "../fixes/shots/B25-2.jpg", "label": "duo-sideways--homeroom-bot--keyboard"}, {"src": "../fixes/shots/B25-3.jpg", "label": "duo-sideways--homeroom-bot"}, {"src": "../fixes/shots/B25-4.jpg", "label": "duo-sideways--homeroom-bot--keyboard"}]}, {"id": "B24", "title": "A request that is already live still reads 'Reading the request' on its Main Chat row", "sev": "medium", "area": "Homeroom bot", "devices": ["duo-sideways"], "summary": "The card is titled 'Your change to Book Club is ready to try' and ends 'It's live.'; directly below, the same request #1 shows a spinner and 'Reading the request · 8 updates'; the list header says 'In progress: 0'. Three statuses for one request on one screen. The 9:28 PM time also floats alone in the left gutter beside the card.", "repro": "Main Chat: Book Club change card and the thread row under the New divider", "cause": "", "verified": true, "sources": ["I27"], "shots": [{"src": "../fixes/shots/B25-1.jpg", "label": "duo-sideways--homeroom-bot"}, {"src": "../fixes/shots/B25-3.jpg", "label": "duo-sideways--homeroom-bot"}]}, {"id": "V05", "title": "Vote tallies read '2 of 1 yes vote', '2/1 yes' and '1/2'", "sev": "medium", "area": "Votes", "devices": ["phone", "iphone-mini", "duo-upright", "duo-sideways", "ipad", "ipad-sideways"], "summary": "Once passed, the chip says '2 of 1 yes vote' (more than needed, singular) and the change header 'Live · 2/1 yes'. Earlier it read '0 of 2 yes votes', then 'Goes live in ~2d 23h · 1/2' beside 'Any of the 3 members can give it'. The threshold seems to change from 2 to 1 and is written four ways. The vote row also mixes purple-outline, blue, green and red pills, and on 375-393pt phones 'No (0)' wraps to a line of its own.", "repro": "Request #1 thread: vote chip and the change header pill", "cause": "", "verified": true, "sources": ["I15", "X3"], "shots": [{"src": "../fixes/shots/B11-2.jpg", "label": "iphone-mini--request"}, {"src": "../fixes/shots/R01-1.jpg", "label": "ipad--request"}, {"src": "../fixes/shots/V05-3.jpg", "label": "duo-sideways--request"}, {"src": "../fixes/shots/V05-4.jpg", "label": "duo-upright--request"}]}, {"id": "L06", "title": "While data loads, screens claim to be empty: Discover says 'No apps to show yet', the bot shows an empty Needs you card", "sev": "medium", "area": "Loading", "devices": ["iphone-max"], "summary": "Discover says 'No apps to show yet.' although every other device lists 11+ apps; the bot shows a 'NEEDS YOU' card with an empty body and no subtitle, chips or + button; the bell has no badge. A slow load should look like loading, not like a final 'nothing here'. Where a skeleton does show (Home), it draws two rows of four icons and full-width bars, unlike the real one row of tiles and square cards, so the page jumps on arrival.", "repro": "Discover list; Homeroom bot NEEDS YOU card; Home skeleton; bell", "cause": "", "verified": true, "sources": ["I3"], "shots": [{"src": "../fixes/shots/L06-1.jpg", "label": "iphone-max--discover"}, {"src": "../fixes/shots/L06-2.jpg", "label": "iphone-max--homeroom-bot"}, {"src": "../fixes/shots/L06-3.jpg", "label": "iphone-max--home"}]}, {"id": "M01", "title": "On the 13 mini, subtitles and chips are cut ('2 n…', 'Just you' at the edge, 'Neighbourhood Sw…') and tab labels touch", "sev": "medium", "area": "iPhone 13 mini", "devices": ["iphone-mini", "phone 393 (app)"], "summary": "At 375pt Book Club's subtitle becomes '1 in progress · 2 n…' (the '2 new messages' is lost behind the '1 to vote' pill; it is already cut to '2 new …' on the 393pt phone), the 'Just you 1' chip is cut at the edge, the project header reads 'Neighbourhood Sw…', Settings subtitles end 'signed in w…' and 'ChatGPT …', the bot's chip reads 'Watering Rot'. In the tab bar 'Homeroom bot' runs into the lit Messages pill with no gap, so neighbouring targets visually merge.", "repro": "Communities rows and chips, project header, Settings subtitles, bot chips, tab bar", "cause": "", "verified": true, "sources": ["I10", "X20"], "shots": [{"src": "../fixes/shots/L05-1.jpg", "label": "iphone-mini--home"}, {"src": "../fixes/shots/Y01-1.jpg", "label": "iphone-mini--communities"}, {"src": "../fixes/shots/M01-3.jpg", "label": "iphone-mini--communities"}, {"src": "../fixes/shots/M01-4.jpg", "label": "iphone-mini--hub-open"}]}, {"id": "U03", "title": "Duo upright: Messages has no header title, and other titles are centred or left-aligned at random", "sev": "medium", "area": "iPhone Duo", "devices": ["duo-upright"], "summary": "Messages shows only the bell and avatar, with an empty left half and no title. Home, Discover, Communities, Homeroom bot, Profile, Settings and Challenges centre their title on the full width while the bell/avatar are pushed left of the clock, so 'Homeroom bot' crowds the bell and the left side is empty. Conversations, hubs and the App view left-align instead. Phones and iPad always left-align.", "repro": "Top header on the unfolded Duo, upright", "cause": "", "verified": false, "sources": ["I5"], "shots": [{"src": "../fixes/shots/U03-1.jpg", "label": "duo-upright--messages"}, {"src": "../fixes/shots/U03-2.jpg", "label": "duo-upright--homeroom-bot"}, {"src": "../fixes/shots/U03-3.jpg", "label": "duo-upright--direct-message"}, {"src": "../fixes/shots/U03-4.jpg", "label": "duo-upright--home"}]}, {"id": "W08", "title": "Discover rows on phones split a title from its subtitle and drop the Join button", "sev": "medium", "area": "Discover", "devices": ["phone", "iphone-mini"], "summary": "At 375-393pt each row is ~96pt tall: the title sits at the top, 'Updated 52m ago' falls ~37pt below it and the Join pill lines up with the subtitle, below the icon's centre. On the Duo upright the same row is compact (title over subtitle, Join centred). The phone version looks like a wrapping bug and fits half as many apps.", "repro": "Discover, ALL APPS list rows", "cause": "", "verified": false, "sources": ["I7"], "shots": [{"src": "../fixes/shots/W08-1.jpg", "label": "phone--discover"}, {"src": "../fixes/shots/W08-2.jpg", "label": "iphone-mini--discover"}, {"src": "../fixes/shots/W08-3.jpg", "label": "duo-upright--discover"}]}, {"id": "P05", "title": "On phones a project's App view has no Suggest button and no way to its Hub", "sev": "medium", "area": "Project page", "devices": ["phone", "iphone-mini", "iphone-max"], "summary": "On the Duo upright and every sidebar layout the header has a 'Suggest' pill (and the sidebar lists Hub, Needs you, Workshop). On every phone the header has only X, the name, bell and avatar: no Suggest, no switch to Hub or Workshop, and the tab bar is hidden. The starter screen itself tells people to tap the Homeroom icon and choose Suggest an improvement.", "repro": "Project App view header", "cause": "", "verified": false, "sources": ["I22"], "shots": [{"src": "../fixes/shots/P05-1.jpg", "label": "phone--app-tab"}, {"src": "../fixes/shots/P05-2.jpg", "label": "iphone-max--hub-group"}, {"src": "../fixes/shots/P05-3.jpg", "label": "duo-upright--app-tab"}]}, {"id": "B26", "title": "The bot-built Watering Rota app draws stray marks over 'Wed' and 'Fri' on a 13 mini", "sev": "low", "area": "Homeroom bot (built apps)", "devices": ["iphone-mini"], "summary": "A solid black square covers the 'd' of 'Wed' and a grey square covers the 'F' of 'Fri', and the seven buttons are squeezed to ~1pt gaps. The same screen renders cleanly on the other phones, so this looks like a paint glitch in the app frame at 375pt.", "repro": "Watering Rota app, 'Your days' row: Wed and Fri", "cause": "", "verified": true, "sources": ["I23"], "shots": [{"src": "../fixes/shots/B26-1.jpg", "label": "iphone-mini--app-tab"}]}, {"id": "B27", "title": "For a Just-you project the bot explains group votes and offers to check 'the project's board'", "sev": "low", "area": "Homeroom bot", "devices": ["phone app"], "summary": "", "repro": "New account with only Restaurant Tier List (Just you): Main Chat > tap 'How does the group decide?'", "cause": "canned suggestion chip and answer ignore the project's audience; 'board' is an internal word for the Workshop", "verified": true, "sources": ["F051"], "shots": [{"src": "../fixes/shots/B27-1.jpg", "label": "21-answer"}]}, {"id": "N06", "title": "A 'Resume' bar for the last app floats over the bottom of Profile and Settings", "sev": "low", "area": "Navigation", "devices": ["Android emulator, Chrome (real)"], "summary": "", "repro": "Open a project's app, then go to You or Settings: a Resume bar sits above the tab bar over 'Your changes' and the Settings list", "cause": "the resume-app bar overlays content without reserving space", "verified": true, "sources": ["F054"], "shots": [{"src": "../fixes/shots/Y03-1.jpg", "label": "13-profile"}, {"src": "../fixes/shots/N06-2.jpg", "label": "iphone-mini--settings"}]}, {"id": "D01", "title": "Going Back with a bottom sheet open leaves the sheet floating over the next screen; the next tap only closes it", "sev": "medium", "area": "Sheets and dialogs", "devices": ["phone 393 (app)"], "summary": "Seen with the hub's ••• sheet and Discover's Filters on phones (Android back, swipe back, browser back). The same menu on desktop closes properly.", "repro": "Phone app shape: open #app/book-club-d10610/workshop, tap the hub's ••• (#dev-plus-btn), then go Back (history.back) or set location.hash to #communities / #settings. Same with #apps > Filters, then #leaderboard/challenges.", "cause": "", "verified": true, "sources": ["X0"], "shots": [{"src": "../fixes/shots/D01-1.jpg", "label": "phone-suggest-sheet-after-back"}, {"src": "../fixes/shots/D01-2.jpg", "label": "phone-settings"}, {"src": "../fixes/shots/D01-3.jpg", "label": "phone-profile"}, {"src": "../fixes/shots/D01-4.jpg", "label": "phone-leaderboard"}]}, {"id": "D02", "title": "Escape in the 'Who says yes?' picker closes the whole New project dialog and loses the typed idea; the picker doesn't match its row label", "sev": "medium", "area": "Sheets and dialogs", "devices": ["desktop 1440", "phone 393 (app)"], "summary": "Escape should close only the picker on top. It closes both layers and lands on Home; reopening shows an empty brief, so the description the person wrote is lost.", "repro": "#home > New project tile > type a brief in 'What should it do?' > Change > press Escape. Home is shown; reopen New project: the brief is empty.", "cause": "", "verified": false, "sources": ["X1", "X27"], "shots": [{"src": "../fixes/shots/D02-1.jpg", "label": "desk-create-typed"}, {"src": "../fixes/shots/D02-2.jpg", "label": "desk-create-who"}, {"src": "../fixes/shots/D02-3.jpg", "label": "desk-create-after-esc"}, {"src": "../fixes/shots/D02-4.jpg", "label": "phone-create-after-esc"}]}, {"id": "D03", "title": "Just opening Invite mints a 7-day link, and Communities then says 'Invite link out' for the project", "sev": "medium", "area": "Invites", "devices": ["all"], "summary": "Looking at the Invite pane creates a live link (by design per invite-pane.tsx) even if nothing is copied or shared. Afterwards the Communities row for Watering Rota changed from '55m ago' to 'Invite link out', telling the owner an invite is out when none was sent. NOTE: this audit run did this to Watering Rota.", "repro": "Communities shows Watering Rota '55m ago'. Open #app/watering-rota-fba57e/workshop > Invite, close it without copying. Reload #communities: the row now says 'Invite link out'.", "cause": "", "verified": true, "sources": ["X2"], "shots": [{"src": "../fixes/shots/D03-1.jpg", "label": "phone-wr-invite"}, {"src": "../fixes/shots/D03-2.jpg", "label": "phone-communities"}, {"src": "../fixes/shots/D03-3.jpg", "label": "desk-communities"}]}, {"id": "D04", "title": "Notification text is cut mid-word with no '…'; the Unread count disagrees with the dots; times truncate", "sev": "medium", "area": "Notifications", "devices": ["phone 393 (app)", "desktop 1440"], "summary": "The body is truncated server-side or by character count and shown without '…', so it reads like a typo and hides the instruction.", "repro": "Tap the bell (#notifications-btn); Unread tab, Watering Rota group.", "cause": "", "verified": false, "sources": ["X4", "X5", "X6"], "shots": [{"src": "../fixes/shots/D04-1.jpg", "label": "phone-sheet"}, {"src": "../fixes/shots/D04-2.jpg", "label": "desk-sheet"}, {"src": "../fixes/shots/D04-3.jpg", "label": "phone-all-scrolled"}, {"src": "../fixes/shots/D04-4.jpg", "label": "phone-all"}]}, {"id": "D05", "title": "The Report form truncates the child-safety reason", "sev": "medium", "area": "Safety", "devices": ["phone 393 (app)", "desktop 1440"], "summary": "The most serious category is the only one cut off, on every shape, so its meaning is hidden. Let it wrap.", "repro": "Homeroom menu > Report app.", "cause": "", "verified": false, "sources": ["X12"], "shots": [{"src": "../fixes/shots/D05-1.jpg", "label": "phone-report"}, {"src": "../fixes/shots/D05-2.jpg", "label": "desk-report"}, {"src": "../fixes/shots/D05-3.jpg", "label": "phone-report"}]}, {"id": "D06", "title": "Your own message's action sheet in a group shows '@@audit_ada'", "sev": "low", "area": "Chat", "devices": ["phone 393 (app)"], "summary": "Double '@'. In the DM the same header reads '@audit_ben', so the group path adds a second @ to an already-@ name.", "repro": "#messages/6, long-press 'Can someone remind me Wednesday?'.", "cause": "", "verified": false, "sources": ["X8"], "shots": [{"src": "../fixes/shots/D06-1.jpg", "label": "phone-group-own-longpress"}]}, {"id": "D07", "title": "The Homeroom menu cuts 'Go to community' to 'Go to com…' when a decision waits; the Invite pane's back arrow goes to a menu you never opened", "sev": "low", "area": "Navigation", "devices": ["phone 393 (app)"], "summary": "The status phrase takes the row and the action label is cut mid-word. Put the status on a second line.", "repro": "Open #app/book-club-d10610 while a vote is waiting on you > Homeroom menu (#platform-mark-btn).", "cause": "", "verified": false, "sources": ["X11", "X29"], "shots": [{"src": "../fixes/shots/D07-1.jpg", "label": "phone-bc-menu"}, {"src": "../fixes/shots/D07-2.jpg", "label": "phone-bc-invite"}]}, {"id": "D08", "title": "A request's More actions sheet mixes emoji and text glyphs as icons; Workshop's orange 'Couldn't take the screenshots' offers no next step", "sev": "low", "area": "Requests", "devices": ["phone 393 (app)"], "summary": "Colour emoji (🏷, 🔕) sit beside monochrome glyphs, in colours (red, orange) that do not mean anything. Every other sheet uses the line icon set (for example the hub ••• sheet).", "repro": "#app/book-club-d10610/dev/issues/1 > More actions (•••).", "cause": "", "verified": false, "sources": ["X13", "X24"], "shots": [{"src": "../fixes/shots/D08-1.jpg", "label": "phone-request-more"}, {"src": "../fixes/shots/D08-2.jpg", "label": "phone-bc-hub"}]}, {"id": "D09", "title": "People pickers put a red 'Block' beside every search result", "sev": "low", "area": "Messages", "devices": ["phone 393 (app)", "desktop 1440"], "summary": "A destructive action shares the row with the primary one in a picker whose job is choosing someone. It is easy to mis-tap and loud for an action rarely wanted here. Move it to a row menu or the profile.", "repro": "#messages > New message (#messages-new) > Direct message > type 'aud'.", "cause": "", "verified": false, "sources": ["X15"], "shots": [{"src": "../fixes/shots/D09-1.jpg", "label": "phone-dm-picker-typed"}, {"src": "../fixes/shots/D09-2.jpg", "label": "phone-group-picker-typed"}, {"src": "../fixes/shots/D09-3.jpg", "label": "phone-new-dm"}]}, {"id": "D10", "title": "A stray blue caret under the chosen Appearance option; focusing Bio in Edit profile scrolls its label under the sheet's edge", "sev": "low", "area": "Settings", "devices": ["phone 393 (app)", "desktop 1440"], "summary": "A small triangle pokes out below the control's border with nothing attached. It reads as a broken tooltip arrow.", "repro": "#settings/theme; or Homeroom menu > Suggest an improvement > Got it > Form.", "cause": "", "verified": false, "sources": ["X16", "X28"], "shots": [{"src": "../fixes/shots/D10-1.jpg", "label": "phone-theme-caret"}, {"src": "../fixes/shots/D10-2.jpg", "label": "phone-appearance"}, {"src": "../fixes/shots/D10-3.jpg", "label": "phone-form"}, {"src": "../fixes/shots/D10-4.jpg", "label": "phone-edit-bio-typed"}]}, {"id": "D11", "title": "Discover's Filters has a Type section with a single chip, 'Other'", "sev": "low", "area": "Discover", "devices": ["phone 393 (app)", "desktop 1440"], "summary": "A filter group with a single 'Other' option filters nothing useful and looks unfinished.", "repro": "#apps > Filters.", "cause": "", "verified": false, "sources": ["X22"], "shots": [{"src": "../fixes/shots/D11-1.jpg", "label": "phone-discover-filters-clean"}, {"src": "../fixes/shots/D11-2.jpg", "label": "desk-discover-filters"}]}, {"id": "D12", "title": "The Workshop's 'By stage' board breaks out of the page column on desktop", "sev": "low", "area": "Project page", "devices": ["desktop 1440"], "summary": "The board starts left of the 'Workshop' title and runs past the end of its rule, so title and content do not share an edge.", "repro": "#app/book-club-d10610/workshop > Workshop > See all > By stage.", "cause": "", "verified": false, "sources": ["X23"], "shots": [{"src": "../fixes/shots/D12-1.jpg", "label": "desk-bc-by-stage"}]}, {"id": "D13", "title": "On desktop, a message's hover toolbar sits far from a left-aligned message", "sev": "low", "area": "Chat", "devices": ["desktop 1440"], "summary": "The reaction/actions bar pins to the transcript's right edge, about 800px from the bubble it acts on, overlapping the row above. It is hard to tell which message it belongs to.", "repro": "#messages/6 on desktop, hover a message from someone else.", "cause": "", "verified": false, "sources": ["X25"], "shots": [{"src": "../fixes/shots/D13-1.jpg", "label": "desk-group-hover"}]}, {"id": "D14", "title": "Cancel on a typed Suggest form throws it away without asking", "sev": "low", "area": "Sheets and dialogs", "devices": ["phone 393 (app)"], "summary": "Several lines of typed feedback and an auto-suggested title vanish on one tap, with no draft kept and no confirm.", "repro": "Homeroom menu > Suggest an improvement > Got it > Form > type in 'What should change?' > Cancel > reopen.", "cause": "", "verified": false, "sources": ["X26"], "shots": [{"src": "../fixes/shots/D14-1.jpg", "label": "phone-form-typed"}, {"src": "../fixes/shots/D14-2.jpg", "label": "phone-after-cancel"}]}, {"id": "D15", "title": "Opening the Homeroom menu logs a snapdom warning every time", "sev": "low", "area": "Console", "devices": ["phone 393 (app)", "desktop 1440"], "summary": "Opening the menu logs '[snapdom] Text in inline/table-cell elements kept its natural width…', so a page snapshot runs on every open (a cost even if never used). In the app shape every load logs '[native-chrome] native session establishment failed: This Homeroom app version must be updated for secure sign-in', and Settings > Homeroom app shows a red 'Could not load Homeroom app settings'. That is likely because the bridge is emulated here, but worth confirming on a real build. No console errors or exceptions were seen; the only HTTP failure was the leaderboard 404.", "repro": "Open the Homeroom menu on any screen; open #settings/usernode in the app shape.", "cause": "", "verified": false, "sources": ["X30"], "shots": [{"src": "../fixes/shots/D15-1.jpg", "label": "desk-menu"}, {"src": "../fixes/shots/D15-2.jpg", "label": "phone-homeroom-app"}]}];

l keyboard.", "Unfolding the real iPhone Duo: only Xcode's Device Hub can fold it, so the unfolded poses are the emulated shapes measured from that simulator earlier today.", "The real Homeroom app on the iPhone 17 Pro Max (emulated in Chrome only; the Duo, iPad and 13 mini ran the real app).", "The real on-screen keyboard in the simulators (focus from a script does not raise it); keyboard-up states use the audit's simulated keyboard heights.", "Push notifications, other languages, slow networks, VoiceOver and TalkBack.", "Project App tabs inside the local iOS build (they stay blank there because local apps are served over plain http, which WebKit blocks inside the https page); the same tabs were covered in Chrome."], "setup": [{"h": "The stack", "items": ["Homeroom at main 313cd65f in Docker (compose project homeroom-audit) with Postgres, MinIO and a local Forgejo as the code host; apps, workers and previews ran as real containers.", "The Homeroom bot ran for real in shadow mode for everyone, on Evan's OpenRouter key: Opus 5.5 for plans, GLM 5.3 Flash for triage and builds. Its recorded runs cost about $7.", "Four local accounts (audit_ada, audit_ben, audit_cy, audit_new), three projects (Just you, a Group, an open Community), two made by the bot and one ready-made, a DM, a group chat, channel lines, four requests."]}, {"h": "How the devices were driven", "items": ["Desktop Chrome and every emulated shape through the Chrome DevTools Protocol, with each device's safe areas, system bars and keyboard height.", "The real Homeroom iOS app (develop + the Duo rotation fix), built against the local stack, on new Audit simulators (Duo, iPad); the screens were opened and measured inside WebKit through Safari's inspector socket. Evan's own simulators were not touched.", "Four reviewer passes read every screenshot; the high findings and many of the medium ones were checked by hand. Each finding says which."]}, {"h": "Worth knowing", "items": ["On a fresh database the translation job translated the whole interface on the Anthropic key, about $30, before it was noticed. It is now off in that stack's .env (LANGUAGE_SYNC_ENABLED=false); production is unaffected.", "A local iOS build now needs HTTPS: native sign-in refuses a plain http API address. A throwaway CA trusted only by the audit simulators plus a small TLS forwarder on port 3443 did it.", "Left out as local-only: 'Couldn't take the screenshots' on changes (no media storage configured), side benchmark builds failing for want of their own key, the Android splash in emulation, blank project App tabs in the local iOS build and the Android emulator (apps on ports the device can't reach), and the leaderboard's 404 (this database has no season event).", "Two bot commits landed on main after the audited build (#6095 'no turn ends on what it will do next', #6096 'the working card follows a drawing into its new thread'). They overlap B01; the note on B01 says why it probably still stands.", "The interaction pass opened the Invite pane on Watering Rota and Book Club, which minted two live invite links in the local stack (see D03). Nothing else was sent, posted or voted on by the review passes."]}]};
(() => {
  const A = window.AUDIT, M = window.META;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SEV = ['high', 'medium', 'low'];
  const store = { get() { try { return JSON.parse(localStorage.getItem('audit-done') || '[]'); } catch { return []; } },
    set(v) { try { localStorage.setItem('audit-done', JSON.stringify(v)); } catch {} } };
  let done = new Set(store.get());

  $('when').textContent = M.when;
  $('lede').textContent = M.lede;
  const n = Object.fromEntries(SEV.map((s) => [s, A.filter((f) => f.sev === s).length]));
  $('stats').innerHTML = SEV.map((s) => `<div class="stat ${s}"><b>${n[s]}</b><span class="muted">${s[0].toUpperCase() + s.slice(1)}</span></div>`).join('')
    + `<div class="stat"><b>${A.length}</b><span class="muted">Findings</span></div><div class="stat"><b>${M.shotsTaken}</b><span class="muted">Screenshots taken</span></div>`;
  const colors = { high: 'var(--high)', medium: 'var(--med)', low: 'var(--low)' };
  $('bar').innerHTML = SEV.map((s) => `<span style="width:${(n[s] / A.length) * 100}%;background:${colors[s]}"></span>`).join('');

  // Lightbox over every screenshot of the open finding.
  let lbSet = [], lbI = 0;
  const lb = $('lightbox');
  const show = () => { const s = lbSet[lbI]; $('lb-img').src = s.src; $('lb-img').alt = s.label; $('lb-cap').textContent = `${s.label}  (${lbI + 1}/${lbSet.length})`; };
  const open = (set, i) => { lbSet = set; lbI = i; show(); lb.hidden = false; $('lb-close').focus(); };
  $('lb-close').onclick = () => { lb.hidden = true; };
  $('lb-prev').onclick = () => { lbI = (lbI - 1 + lbSet.length) % lbSet.length; show(); };
  $('lb-next').onclick = () => { lbI = (lbI + 1) % lbSet.length; show(); };
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.hidden = true; });
  document.addEventListener('keydown', (e) => { if (lb.hidden) return; if (e.key === 'Escape') lb.hidden = true; if (e.key === 'ArrowLeft') $('lb-prev').click(); if (e.key === 'ArrowRight') $('lb-next').click(); });

  const byId = Object.fromEntries(A.map((f) => [f.id, f]));
  $('start-p').textContent = M.startNote;
  $('startlist').innerHTML = M.start.map((id) => { const f = byId[id]; if (!f) return ''; return `<article class="card">
      <div class="meta"><span class="tag sev ${f.sev}">${f.sev}</span><span class="tag area">${esc(f.area)}</span><span class="id">${f.id}</span></div>
      <h3><a href="#${f.id}" data-jump="${f.id}">${esc(f.title)}</a></h3>
      ${f.shots[0] ? `<img class="shot" loading="lazy" src="${f.shots[0].src}" alt="${esc(f.shots[0].label)}" data-start="${f.id}">` : ''}
      <p class="muted">${esc(f.summary || f.repro).slice(0, 220)}</p></article>`; }).join('');
  $('startlist').addEventListener('click', (e) => {
    const img = e.target.closest('img[data-start]'); if (img) { open(byId[img.dataset.start].shots, 0); return; }
    const a = e.target.closest('a[data-jump]'); if (a) { e.preventDefault(); reveal(a.dataset.jump); }
  });

  const areas = [...new Set(A.map((f) => f.area))].sort();
  $('f-area').innerHTML += areas.map((a) => `<option>${esc(a)}</option>`).join('');
  $('f-dev').innerHTML += M.deviceGroups.map((g) => `<option value="${esc(g.key)}">${esc(g.label)}</option>`).join('');

  const list = $('list');
  const order = { high: 0, medium: 1, low: 2 };
  const sorted = [...A].sort((a, b) => order[a.sev] - order[b.sev] || (b.area === 'Homeroom bot') - (a.area === 'Homeroom bot') || a.id.localeCompare(b.id));
  list.innerHTML = sorted.map((f) => `<article class="item ${f.sev}" id="${f.id}" data-id="${f.id}">
    <div class="row" role="button" tabindex="0" aria-expanded="false">
      <div><div class="titleline"><h3>${esc(f.title)}</h3><span class="id">${f.id}</span></div>
        <div class="meta"><span class="tag sev ${f.sev}">${f.sev}</span><span class="tag area">${esc(f.area)}</span>${f.devices.slice(0, 3).map((d) => `<span class="tag">${esc(d)}</span>`).join('')}${f.devices.length > 3 ? `<span class="tag">+${f.devices.length - 3}</span>` : ''}<span class="tag ver">${f.verified ? 'Checked by hand' : 'Found by a reviewer pass'}</span></div></div>
      ${f.shots[0] ? `<img class="thumb" loading="lazy" src="${f.shots[0].src}" alt="">` : '<span></span>'}
    </div>
    <div class="detail" hidden>
      <dl>${f.summary ? `<dt>What</dt><dd>${esc(f.summary)}</dd>` : ''}<dt>How to see it</dt><dd>${esc(f.repro)}</dd>${f.cause ? `<dt>Likely cause</dt><dd>${esc(f.cause)}</dd>` : ''}<dt>Seen on</dt><dd>${esc(f.devices.join(', ') || 'see shots')}</dd></dl>
      <div class="shots">${f.shots.map((s, i) => `<figure><img loading="lazy" src="${s.src}" alt="${esc(s.label)}" data-i="${i}"><figcaption>${esc(s.label)}</figcaption></figure>`).join('')}</div>
      <label class="donebox"><input type="checkbox" class="done" ${done.has(f.id) ? 'checked' : ''}> Done (kept in this browser)</label>
    </div></article>`).join('');
  const toggle = (item, force) => { const d = item.querySelector('.detail'); const r = item.querySelector('.row'); const openIt = force ?? d.hidden; d.hidden = !openIt; r.setAttribute('aria-expanded', String(openIt)); };
  list.addEventListener('click', (e) => {
    const item = e.target.closest('.item'); if (!item) return;
    const img = e.target.closest('.shots img'); if (img) { open(byId[item.dataset.id].shots, Number(img.dataset.i)); return; }
    if (e.target.closest('.row')) toggle(item);
  });
  list.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) { e.preventDefault(); toggle(e.target.closest('.item')); } });
  list.addEventListener('change', (e) => { if (!e.target.classList.contains('done')) return; const id = e.target.closest('.item').dataset.id; e.target.checked ? done.add(id) : done.delete(id); store.set([...done]); apply(); });

  const pressed = (s) => $('f-' + s).getAttribute('aria-pressed') === 'true';
  SEV.forEach((s) => { $('f-' + s).onclick = () => { $('f-' + s).setAttribute('aria-pressed', String(!pressed(s))); apply(); }; });
  ['f-area', 'f-dev', 'f-hidedone'].forEach((id) => $(id).addEventListener('change', apply));
  $('f-q').addEventListener('input', apply);
  function apply() {
    const area = $('f-area').value, dev = $('f-dev').value, q = $('f-q').value.trim().toLowerCase(), hide = $('f-hidedone').checked;
    const g = M.deviceGroups.find((x) => x.key === dev);
    let shown = 0;
    for (const item of list.children) {
      const f = byId[item.dataset.id];
      const hay = (f.title + ' ' + f.repro + ' ' + f.cause + ' ' + f.summary + ' ' + f.devices.join(' ')).toLowerCase();
      const devOk = !g || g.match.some((m) => hay.includes(m));
      const ok = pressed(f.sev) && (!area || f.area === area) && devOk && (!q || hay.includes(q)) && !(hide && done.has(f.id));
      item.hidden = !ok; item.classList.toggle('done', done.has(f.id)); if (ok) shown++;
    }
    $('f-count').textContent = `${shown} of ${A.length}`;
  }
  apply();

  function reveal(id) { const item = $(id); if (!item) return; SEV.forEach((s) => $('f-' + s).setAttribute('aria-pressed', 'true')); $('f-area').value = ''; $('f-dev').value = ''; $('f-q').value = ''; $('f-hidedone').checked = false; apply(); toggle(item, true); item.scrollIntoView({ block: 'start' }); }
  if (/^#[A-Za-z]\d+$/.test(location.hash)) reveal(location.hash.slice(1));

  $('bot-p').textContent = M.botNote;
  $('journeys').innerHTML = M.journeys.map((j) => `<article class="card journey"><div class="meta"><span class="tag area">${esc(j.who)}</span><span class="tag">${esc(j.device)}</span></div><h3>${esc(j.title)}</h3>
    <ol>${j.steps.map((s) => `<li class="${s.bad ? 'bad' : ''}"><time>${esc(s.t)}</time><span>${esc(s.what)}${s.ref ? ` <a href="#${s.ref}" data-jump="${s.ref}">${s.ref}</a>` : ''}</span></li>`).join('')}</ol>
    <p class="verdict ${j.ok ? 'ok' : 'bad'}">${esc(j.verdict)}</p></article>`).join('');
  $('journeys').addEventListener('click', (e) => { const a = e.target.closest('a[data-jump]'); if (a) { e.preventDefault(); reveal(a.dataset.jump); } });

  $('cov-p').textContent = M.coverageNote;
  const C = M.coverage;
  $('covtable').innerHTML = `<thead><tr><th>Screen</th>${C.devices.map((d) => `<th>${esc(d)}</th>`).join('')}</tr></thead><tbody>${C.rows.map((r) => `<tr><td>${esc(r.screen)}</td>${r.cells.map((c) => `<td class="c ${c === '·' ? 'n' : 'y'}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
  $('notcovered').innerHTML = `<h3>Not covered</h3><ul>${M.notCovered.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  $('setupnotes').innerHTML = M.setup.map((s) => `<div><h3>${esc(s.h)}</h3><ul>${s.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
})();
</script>
